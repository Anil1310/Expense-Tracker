        function ensureScrollOffset() {
            if ((window.scrollY || document.documentElement.scrollTop || 0) === 0) {

            }

            if (e.target && e.target.closest && e.target.closest('.table-responsive')) {
                return; // Let user swipe freely up/down and left/right inside table

            ensureScrollOffset();
        }, { passive: true });

    // Persistent Cache implementation
    class ExpenseCache {
        constructor() {
            this.cacheKey = 'expense_app_cache_v3';
            this.cacheDuration = 30 * 24 * 60 * 60 * 1000; // 30 days persistent offline storage
            this.shortCacheDuration = 24 * 60 * 60 * 1000; // 24 hours
            try {
                localStorage.removeItem('expense_app_cache');
                localStorage.removeItem('expense_app_cache_v2');
            } catch (e) {}
            this.loadFromStorage();
        }

        loadFromStorage() {
            try {
                const stored = localStorage.getItem(this.cacheKey);
                this.cache = stored ? new Map(JSON.parse(stored)) : new Map();
            } catch (e) {
                this.cache = new Map();
            }
        }

        saveToStorage() {
            try {
                localStorage.setItem(this.cacheKey, JSON.stringify(Array.from(this.cache.entries())));
            } catch (e) { console.error("Cache Save Error", e); }
        }

        set(key, data) {
            this.cache.set(key, {
                data: data,
                timestamp: Date.now()
            });
            this.saveToStorage();
        }

        get(key) {
            const item = this.cache.get(key);
            if (!item) return null;
            // Always return cached data immediately for instant 0ms preloaded render!
            return item.data;
        }

        invalidate(key) {
            if (!key) return;
            const keysToDelete = [];
            this.cache.forEach((_, k) => {
                if (k === key || k.startsWith(key) || (key.startsWith('monthly_') && k.startsWith(key.split('_')[0] + '_' + key.split('_')[1]))) {
                    keysToDelete.push(k);
                }
            });
            keysToDelete.forEach(k => this.cache.delete(k));
            this.saveToStorage();
        }

        invalidateAll() {
            this.cache.clear();
            localStorage.removeItem(this.cacheKey);
        }

    function startAutoSync() {

    // ── Resilient Google Apps Script Bridge & Offline-First Sync Engine ──────────
    if (typeof google === "undefined" || !google.script || !google.script.run || !google.script.run.withSuccessHandler) {
        (function () {
            function createBridgeRunner(successHandler, failureHandler, userObject) {
                const runner = function () { };
                runner.withSuccessHandler = function (handler) { return createBridgeRunner(handler, failureHandler, userObject); };
                runner.withFailureHandler = function (handler) { return createBridgeRunner(successHandler, handler, userObject); };
                runner.withUserObject = function (obj) { return createBridgeRunner(successHandler, failureHandler, obj); };

                return new Proxy(runner, {
                    get: function (target, prop) {
                        if (prop in target) return target[prop];
                        if (typeof prop !== "string" || prop.startsWith("_")) return undefined;

                        return function (...args) {
                            const payload = { method: prop, args: args };
                            const endpoints = [
                                "/api/apps-script",
                                "https://expenselive.vercel.app/api/apps-script",
                                "https://script.google.com/macros/s/AKfycbys6Y0MD92ZlCR3rOjdQCSH5PqTD6NxnUOY6c2eq1h1tBEAfYnbKrbLxXZ4zfFAf3qe/exec"
                            ];

                            if (typeof window !== "undefined" && (window.location.protocol === "file:" || !window.location.hostname.includes("vercel.app"))) {
                                const directIdx = endpoints.indexOf("https://expenselive.vercel.app/api/apps-script");
                                if (directIdx > 0) {
                                    endpoints.splice(directIdx, 1);
                                    endpoints.unshift("https://expenselive.vercel.app/api/apps-script");
                                }
                            }

                            async function sendRequest(urlIdx = 0) {
                                try {
                                    const res = await fetch(endpoints[urlIdx], {
                                        method: "POST",
                                        headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify(payload),
                                        redirect: "follow"
                                    });

                                    if (!res.ok && urlIdx + 1 < endpoints.length) {
                                        return sendRequest(urlIdx + 1);
                                    }

                                    const rawText = await res.text();
                                    let data;
                                    try {
                                        data = rawText && rawText.trim() ? JSON.parse(rawText) : {};
                                    } catch (parseErr) {
                                        if (urlIdx + 1 < endpoints.length) {
                                            return sendRequest(urlIdx + 1);
                                        }
                                        throw new Error("Invalid response from server: " + (rawText ? rawText.slice(0, 100) : "empty response"));
                                    }

                                    if (!res.ok || (data && data.success === false)) {
                                        throw new Error(data?.error || ("Apps Script request failed: " + res.status));
                                    }

                                    const result = data && "result" in data ? data.result : data;
                                    if (successHandler) {
                                        if (userObject !== undefined) successHandler(result, userObject);
                                        else successHandler(result);
                                    }
                                    return result;
                                } catch (err) {
                                    if (urlIdx + 1 < endpoints.length) {
                                        return sendRequest(urlIdx + 1);
                                    }
                                    console.error("Apps Script Bridge Error (" + prop + "):", err);
                                    if (failureHandler) {
                                        if (userObject !== undefined) failureHandler(err, userObject);
                                        else failureHandler(err);
                                    }
                                }
                            }

                            return sendRequest(0);
                        };
                    }
                });
            }

            window.google = window.google || {};
            window.google.script = window.google.script || {};
            window.google.script.run = createBridgeRunner(null, null, undefined);
        })();
    }

                if (labelEl) labelEl.textContent = "All Saved";
                pill.title = "All changes saved and synced with Google Sheets.";

        enqueue: function (actionType, payload, optimisticId) {
            const queue = this.getQueue();
            const task = {
                id: optimisticId || ("sync_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6)),
                action: actionType, // "add" | "update" | "delete"
                payload: payload,
                timestamp: Date.now(),
                retries: 0
            };
            queue.push(task);
            this.setQueue(queue);
            this.processQueue();
            return task.id;
        },

        removeTask: function (taskId) {
            const queue = this.getQueue().filter(t => t.id !== taskId);
            this.setQueue(queue);
        },

        processQueue: async function (forceManual = false) {
            if (this.isProcessing) return;
            const queue = this.getQueue();
            if (queue.length === 0) {
                this.updateSyncUI("synced");
                return;
            }

            if (!navigator.onLine && !forceManual) {
                this.updateSyncUI();
                return;
            }

            this.isProcessing = true;
            this.updateSyncUI("syncing");

            try {
                for (let i = 0; i < queue.length; i++) {
                    const task = queue[i];
                    try {
                        await this.executeTask(task);
                        this.removeTask(task.id);
                    } catch (taskErr) {
                        console.warn("Sync task failed, will retry later:", task, taskErr);
                        task.retries = (task.retries || 0) + 1;
                        this.setQueue(this.getQueue());
                        break;
                    }
                }
            } finally {
                this.isProcessing = false;
                this.updateSyncUI();
            }
        },

        executeTask: function (task) {
            return new Promise((resolve, reject) => {
                if (!window.google || !window.google.script || !window.google.script.run) {
                    return reject(new Error("Bridge not ready"));
                }

                const runner = window.google.script.run
                    .withSuccessHandler((res) => {
                        const result = res && res.result ? res.result : res;
                        if (result && result.error) {
                            reject(new Error(result.error));
                        } else {
                            resolve(result);
                        }
                    })
                    .withFailureHandler((err) => {
                        reject(err);
                    });

                if (task.action === "add") {
                    runner.addEntry(task.payload);
                } else if (task.action === "update") {
                    runner.updateEntry(task.payload);
                } else if (task.action === "delete") {
                    runner.deleteEntry(task.payload.uniqueId, task.payload.month);
                } else {
                    resolve(null);
                }
            });
        },

        mergePendingRows: function (serverRows, month) {
            if (!Array.isArray(serverRows)) return serverRows;
            const queue = this.getQueue();
            const relevantAdds = queue.filter(t => t.action === "add" && t.payload && t.payload.month === month);

            const merged = [...serverRows];
            relevantAdds.forEach(task => {
                const p = task.payload;
                const exists = merged.some(r => r && (
                    String(r[1] || "").trim() === String(task.id).trim() ||
                    (String(r[4] || "").toLowerCase() === String(p.itemList || "").toLowerCase() &&
                     Math.abs((parseFloat(r[5]) || 0) - (parseFloat(p.amount) || 0)) < 0.01)
                ));
                if (!exists) {
                    const tempSn = merged.length > 0 ? (Math.max(0, ...merged.map(r => parseInt(r[0]) || 0)) + 1) : 1;
                    const optRow = [
                        tempSn,
                        task.id,
                        p.date,
                        p.month,
                        p.itemList,
                        parseFloat(p.amount) || 0,
                        p.credit || "",
                        p.user || "Anil Chahar"
                    ];
                    optRow.sn = tempSn;
                    optRow.isOptimistic = true;
                    merged.unshift(optRow);
                }
            });
            return merged;
        }
    };

    // ── Count-up animation utility ─────────────────────────────────────────────
    /**
     * Smoothly animates a numeric value inside an element from its current displayed
     * value to `endValue` over `duration` ms.
     * @param {HTMLElement} el       - Target DOM element
     * @param {number}      endValue - Final numerical value
     * @param {string}      type     - 'currency' or 'integer' (default 'integer')
     * @param {number}      duration - Animation length in ms (default 600)
     */
    function animateValue(el, endValue, type = 'integer', duration = 600) {
        if (!el) return;

        // Instant 0ms update on mobile for a fast, responsive and delay-free experience
        const isMobile = window.innerWidth <= 992 || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isMobile || duration <= 0) {
            el.textContent = type === 'currency' ? formatCurrency(endValue) : Math.round(endValue);
            return;
        }

        // Parse current displayed value as start point
        const rawText = el.textContent.replace(/[^\d.]/g, '');
        const startValue = parseFloat(rawText) || 0;
        const startTime = performance.now();

        // Ease-out cubic easing
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const current = startValue + (endValue - startValue) * easeOutCubic(progress);

            if (type === 'currency') {
                el.textContent = formatCurrency(current);
            } else {
                el.textContent = Math.round(current);
            }

            if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function formatDisplayDate(dateString) {
        if (!dateString) return '';

        // If it's already DD-MM-YYYY, return as is to avoid JS parsing bugs (where it assumes MM-DD-YYYY)
        if (typeof dateString === 'string' && dateString.match(/^\d{2}-\d{2}-\d{4}$/)) {
            return dateString;
        }

        try {
            const date = new Date(dateString);
            if (!isNaN(date.getTime())) {
                const day = date.getDate().toString().padStart(2, '0');
                const monthName = MONTHS[date.getMonth()];
                const year = date.getFullYear();

                return `${monthName} ${day}, ${year}`;
            }
            if (dateString.includes(' ')) {
                const parts = dateString.split(' ');
                if (parts.length >= 3) {
                    const monthName = parts[0];
                    const monthIndex = MONTHS.indexOf(monthName);
                    const month = monthIndex !== -1 ? (monthIndex + 1).toString().padStart(2, '0') : "01";
                    const day = parseInt(parts[1]).toString().padStart(2, '0');
                    const year = parts[2];
                    return `${day}-${month}-${year}`;
                } else if (parts.length >= 2) {
                    const monthName = parts[0];
                    const monthIndex = MONTHS.indexOf(monthName);
                    const month = monthIndex !== -1 ? (monthIndex + 1).toString().padStart(2, '0') : "01";
                    const day = parseInt(parts[1]).toString().padStart(2, '0');
                    const year = extractYearFromDate(dateString);
                    return `${day}-${month}-${year}`;
                }
            }
            if (dateString.includes('-')) {
                const [year, month, day] = dateString.split('-');
                const monthStr = parseInt(month).toString().padStart(2, '0');
                const paddedDay = parseInt(day).toString().padStart(2, '0');
                return `${paddedDay}-${monthStr}-${year}`;
            }
        } catch (e) {
            console.error("Error formatting date:", e);
        }
        return dateString;
    }

    function extractYearFromDate(dateString) {
        if (!dateString) return getCurrentYear();

        try {
            // Try parsing as Date object first
            const date = new Date(dateString);
            if (!isNaN(date.getTime())) {
                let year = date.getFullYear();
                return year.toString();
            }

            // Handle format "Jan 16 2024"
            if (dateString.includes(' ')) {
                const parts = dateString.split(' ');
                if (parts.length >= 3 && !isNaN(parseInt(parts[2]))) {
                    return parts[2];
                }
            }

            // Handle format "2026-01-16"
            if (dateString.includes('-')) {
                const yearMatch = dateString.match(/^(\d{4})/);
                if (yearMatch) {
                    return yearMatch[1];
                }
            }

            console.warn("Could not extract year from date:", dateString);
            return getCurrentYear(); // Default to current year

        } catch (e) {
            console.error("Error extracting year:", e, "from:", dateString);
            return getCurrentYear(); // Default to current year
        }
    }

                    const y = parseInt(item.year);
                    if (!isNaN(y) && y >= startYear) {
                        yearsSet.add(item.year.toString());
                    }
                }
            });
        }

        // Sort years descending
        const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);

        // Helper to populate a select element
        const populateSelect = (selectElement, includeAllOption = false) => {
            if (!selectElement) return;

            const currentValue = selectElement.value;
            selectElement.innerHTML = '';

            if (includeAllOption) {
                const allOption = document.createElement('option');
                allOption.value = "all";
                allOption.textContent = "All Years";
                if (currentValue === "all" || currentValue === "") {
                    allOption.selected = true;
                }
                selectElement.appendChild(allOption);
            }

            sortedYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (!includeAllOption && year === currentYear && !currentValue) {
                    option.selected = true;
                } else if (currentValue && year === currentValue) {
                    option.selected = true;
                }
                selectElement.appendChild(option);
            });
        };

        // Populate the dropdowns with All Years support across pages
        populateSelect(yearSelector, true);
        populateSelect(yearFilter, true);   // Reports filter
        populateSelect(summaryYear, true);  // Data Summary
        populateSelect(graphYear, true);    // Analytics / Graphs
    }

    // Page navigation
    function showPage(pageId) {
        console.log(`Showing page: ${pageId}`);

        document.querySelectorAll('.page-content').forEach(page => {
            page.classList.add('d-none');

        window.scrollTo({ top: 0, behavior: 'instant' });
        const mainContent = document.getElementById('main-content');

        document.querySelectorAll('.nav-link').forEach(link => {

        if (activeLink) {

        // Special case: If switching TO dashboard, but NOT via showMonth, clear sub-active states
        if (pageId === 'dashboard') {

        } else if (pageId === 'reports') {
            document.body.classList.add('reports-active');
            document.body.classList.remove('dashboard-active');
            // Clear all data-month active states if on other pages
            document.querySelectorAll('.nav-link[data-month]').forEach(link => {
                link.classList.remove('active');
            });
        } else {
            document.body.classList.remove('dashboard-active', 'reports-active');
            // Clear all data-month active states if on other pages
            document.querySelectorAll('.nav-link[data-month]').forEach(link => {
                link.classList.remove('active');
            });
        }

        // Update active nav links (Mobile Bottom Nav)
        document.querySelectorAll('.bottom-nav-item').forEach(link => {
            link.classList.remove('active');

        const activeBottomLink = document.querySelector(`.bottom-nav-item[data-page='${pageId}']`);
        if (activeBottomLink) {
            activeBottomLink.classList.add('active');
        }

        // Load page-specific data
        console.log(`Loading data for page: ${pageId}`);
        if (pageId === 'reports') {
            loadEnhancedReports();
        } else if (pageId === 'data') {
            loadDataSummary();
        } else if (pageId === 'graphs') {
            loadGraphs();
        } else if (pageId === 'yearly-chart') {
            loadYearlyChart();
        } else if (pageId === 'categories') {
            loadCategoryExpenses();
        } else if (pageId === 'dashboard') {
            // Ensure dashboard data is loaded
            if (!expenseData || expenseData.length === 0) {
                loadMonth(CURRENT_MONTH);
            }

        // Re-apply table header freezing after page switch
        setTimeout(freezeTableHeaders, 300);

        console.log(`Page ${pageId} navigation complete`);
    }

    // Load monthly data
    function loadMonth(month, isBackground = false, forceRefresh = false) {
        currentDashboardPage = 1;
        const targetMonth = month || CURRENT_MONTH;
        CURRENT_MONTH = targetMonth; // Update context for all table actions

        const pageTitle = document.getElementById('page-title');
        const tableTitle = document.getElementById('table-title');

        if (pageTitle) pageTitle.textContent = 'Expenses Tracker Pro';
        const titleText = document.getElementById('table-title-text');
        const isAll = (targetMonth.toLowerCase() === 'all');
        const isMobile = window.innerWidth <= 768;
        const displayMonthTitle = isAll
            ? (isMobile ? 'All 2026' : `${CURRENT_YEAR || 2026} All Expenses (12 Months)`)
            : (isMobile ? `${targetMonth} 2026` : `${targetMonth} 2026 Expenses`);

        if (titleText) titleText.textContent = displayMonthTitle;
        else if (tableTitle) tableTitle.textContent = displayMonthTitle;

        document.querySelectorAll('.month-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent.trim().toLowerCase() === targetMonth.toLowerCase()) {
                btn.classList.add('active');
            }
        });

        const loadingSpinner = document.getElementById('loading-spinner');
        const tableBody = document.getElementById('expense-table-body');

        const cacheKey = `monthly_${targetMonth}_${CURRENT_YEAR || 2026}`;

        // 1. CHECK SERVER-INJECTED DATA (Fastest — only on initial load, skip on forceRefresh)
        if (!forceRefresh && window.SERVER_INITIAL_DATA && window.SERVER_INITIAL_DATA.month === targetMonth && window.SERVER_INITIAL_DATA.monthlyData) {
            console.log("Using injected month data for", targetMonth);
            const data = window.SERVER_INITIAL_DATA.monthlyData;
            window.SERVER_INITIAL_DATA.monthlyData = null; // Consume so future manual refreshes fetch fresh data
            if (window.expenseCache) window.expenseCache.set(cacheKey, data);
            handleMonthData(data);
            return;
        }

        // 2. CHECK PERSISTENT CACHE (Instant 0ms render with background cloud revalidation)
        if (!forceRefresh) {
            const cachedData = window.expenseCache ? window.expenseCache.get(cacheKey) : null;
            if (cachedData) {
                handleMonthData(cachedData);
                // Revalidate in background so changes made on mobile APK or laptop appear immediately on both
                if (!isAll && typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((fresh) => {
                            const res = fresh && fresh.result ? fresh.result : fresh;
                            if (res && !res.error && res.tableData) {
                                if (window.expenseCache) window.expenseCache.set(cacheKey, res);
                                handleMonthData(res);
                            }
                        })
                        .getMonthlyData(targetMonth);
                }
                return;
            }

            // 2b. FAST DERIVE FROM in-memory all_data IF AVAILABLE (Instant 0ms render for all 12 months)
            const allData = window.expenseCache ? window.expenseCache.get('all_data') : null;
            const allList = (allData && allData.allExpenses) || (typeof allExpenseData !== 'undefined' ? allExpenseData : null);
            if (allList && allList.length > 0 && typeof extractMonthlyDataFromAllData === 'function') {
                const derived = extractMonthlyDataFromAllData(allList, targetMonth, CURRENT_YEAR || 2026);
                if (derived) {
                    handleMonthData(derived);
                    // Silently refresh in background without interrupting user or flashing skeletons
                    if (!isAll && typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((fresh) => {
                                const res = fresh && fresh.result ? fresh.result : fresh;
                                if (res && !res.error && res.tableData) {
                                    if (window.expenseCache) window.expenseCache.set(cacheKey, res);
                                    handleMonthData(res);
                                }
                            })
                            .getMonthlyData(targetMonth);
                    }
                    return;
                }
            }
        }

        // 3. SHOW SKELETON ONLY WHEN ACTUALLY WAITING ON NETWORK
        if (!isBackground) {
            showStatSkeletons();
            showTableSkeletons('expense-table-body', 8);
        }

        // 4. NETWORK FETCH
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            if (isAll) {
                google.script.run
                    .withSuccessHandler((allData) => {
                        const res = allData && allData.result ? allData.result : allData;
                        if (window.expenseCache) window.expenseCache.set('all_data', res);
                        const derived = extractMonthlyDataFromAllData(res?.allExpenses || [], 'All', CURRENT_YEAR || 2026);
                        if (derived) {
                            if (window.expenseCache) window.expenseCache.set(cacheKey, derived);
                            handleMonthData(derived);
                        }
                    })
                    .withFailureHandler(handleError)
                    .getAllData();
            } else {
                google.script.run
                    .withSuccessHandler((data) => {
                        const res = data && data.result ? data.result : data;
                        if (window.expenseCache) window.expenseCache.set(cacheKey, res);
                        handleMonthData(res);
                    })
                    .withFailureHandler(handleError)
                    .getMonthlyData(targetMonth);
            }
        }
    }

    function handleMonthData(response) {
        const loadingSpinner = document.getElementById('loading-spinner');
        if (loadingSpinner) loadingSpinner.classList.add('d-none');
        if (!response) return;

        const res = (response && response.result) ? response.result : response;

        if (res.error) {
            showAlert("Error: " + res.error, "danger");
            console.error("Error in monthly data:", res.error);
            return;
        }

        // Incoming fresh table data
        let incomingRows = res.tableData ? [...res.tableData] : [];

        // Safety Shield: preserve any optimistic / pending sync rows so they NEVER disappear
        if (window.SyncEngine && typeof window.SyncEngine.mergePendingRows === 'function') {
            incomingRows = window.SyncEngine.mergePendingRows(incomingRows, res.month || CURRENT_MONTH);
        } else if (expenseData && expenseData.length > 0) {
            const pendingOptimistic = expenseData.filter(r => r && r.isOptimistic);
            pendingOptimistic.forEach(opt => {
                const alreadyIncluded = incomingRows.some(sr => sr && (sr[1] === opt[1] || (sr[4] === opt[4] && parseFloat(sr[5]) === parseFloat(opt[5]) && sr[2] === opt[2])));
                if (!alreadyIncluded) {
                    incomingRows.push(opt);
                }
            });
        }

        expenseData = incomingRows;

        const totalExpenses = document.getElementById('total-expenses');
        const totalCategories = document.getElementById('total-categories');
        const totalDays = document.getElementById('total-days');

        animateValue(totalExpenses, res.totalExpenses || 0, 'currency');
        animateValue(totalCategories, res.uniqueCategories || 0, 'integer');
        animateValue(totalDays, res.daysWithExpenses || 0, 'integer');

        renderDashboardTable(expenseData);

        // Apply table header freezing after data loads
        setTimeout(freezeTableHeaders, 100);
    }

    function renderDashboardTable(data) {
        const tableBody = document.getElementById('expense-table-body');
        const paginationContainer = document.getElementById('dashboard-pagination');
        const pageInfo = document.getElementById('dashboard-page-info');
        const countBadge = document.getElementById('records-counter-badge');
        if (!tableBody) return;

        // Assign stable S.N. to each row before sorting/reversing
        let allLatestData = data.map((row, index) => {
            let r = [...row];
            const parsedSn = parseInt(row[0]);
            r.sn = (!isNaN(parsedSn) && parsedSn > 0) ? parsedSn : (index + 1);
            return r;
        });

        // Update record count badge (desktop only)
        if (countBadge) {
            countBadge.textContent = `${allLatestData.length} Records`;
            if (window.innerWidth <= 991) {
                countBadge.style.display = 'none';
            } else {
                countBadge.style.display = allLatestData.length > 0 ? 'inline-flex' : 'none';
            }
        }

        // Sorting and limiting to latest if no sort
        if (dashboardSortCol) {
            allLatestData.sort((a, b) => {
                let valA, valB;
                switch (dashboardSortCol) {
                    case 'sn': valA = a.sn; valB = b.sn; break;
                    case 'id': valA = String(a[1] || ''); valB = String(b[1] || ''); break;
                    case 'date': valA = new Date(a[2]); valB = new Date(b[2]); break;
                    case 'item': valA = String(a[4] || ''); valB = String(b[4] || ''); break;
                    case 'amount': valA = parseFloat(a[5]) || 0; valB = parseFloat(b[5]) || 0; break;
                    case 'credit': valA = String(a[6] || ''); valB = String(b[6] || ''); break;
                    case 'admin': valA = String(a[7] || ''); valB = String(b[7] || ''); break;
                    default: return 0;
                }

                if (valA < valB) return dashboardSortDir === 'asc' ? -1 : 1;
                if (valA > valB) return dashboardSortDir === 'asc' ? 1 : -1;
                return 0;
            });
        }

        // Render ALL records of the month (1-140) on BOTH Desktop and Mobile so user can smoothly scroll up and down through every record
        const latestData = allLatestData;
        if (paginationContainer) paginationContainer.innerHTML = '';
        if (pageInfo) pageInfo.textContent = '';

        if (latestData.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center py-5">
                        <div class="empty-state" style="animation: fadeIn 0.5s ease;">
                            <i class="fas fa-receipt mb-3" style="font-size: 3.5rem; opacity: 0.1; color: var(--primary-color);"></i>
                            <h5 class="fw-bold" style="color: var(--primary-color);">No Expenses Recorded</h5>
                            <p class="text-muted small mb-4">You haven't added any expenses for ${CURRENT_MONTH} yet.</p>
                            <button class="btn btn-primary px-4 rounded-pill" onclick="showAddModal()" style="box-shadow: var(--shadow-md);">
                                <i class="fas fa-plus me-2"></i> Add First Expense
                            </button>
                        </div>
                    </td>
                </tr>
            `;
            if (paginationContainer) paginationContainer.innerHTML = '';
            if (pageInfo) pageInfo.textContent = '';
        } else {
            tableBody.innerHTML = ''; // Clear before appending

            const fragment = document.createDocumentFragment();
            latestData.forEach((row, index) => {
                const sn = row.sn;
                const uniqueId = row[1];
                const date = row[2];
                const itemList = row[4];
                const amount = formatCurrency(row[5]);
                const creditDisplay = row[6] || '';
                const adminDisplay = row[7] || '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="S.N">${sn}</td>
                    <td data-label="Unique ID">${uniqueId}</td>
                    <td data-label="Date">${date}</td>
                    <td data-label="Item List">${itemList}</td>
                    <td data-label="Amount">${amount}</td>
                    <td data-label="Credit & Remark">${formatCreditDisplay(creditDisplay, itemList)}</td>
                    <td data-label="Admin">${adminDisplay}</td>
                    <td data-label="Actions"></td>
                `;

                const actionTd = tr.querySelector('td:last-child');
                const viewBtn = document.createElement('button');
                viewBtn.className = 'action-btn text-info me-1';
                viewBtn.innerHTML = '<i class="fas fa-eye"></i>';
                viewBtn.title = 'View Entry';
                viewBtn.onclick = () => viewEntryInDashboard(CURRENT_MONTH, uniqueId);
                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn text-primary me-1';
                editBtn.innerHTML = '<i class="fas fa-edit"></i>';
                editBtn.title = 'Edit Entry';
                editBtn.onclick = () => editEntry(uniqueId, CURRENT_MONTH);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'action-btn text-danger';
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                deleteBtn.title = 'Delete Entry';
                deleteBtn.onclick = () => openDeleteModal(uniqueId, CURRENT_MONTH);

                actionTd.appendChild(viewBtn);
                actionTd.appendChild(editBtn);
                actionTd.appendChild(deleteBtn);
                fragment.appendChild(tr);
            });
            tableBody.appendChild(fragment);

            if (isMobile) {
                // Mobile: Add clean end footer showing all records loaded
                const footer = document.createElement('tr');
                footer.className = 'scroll-sentinel';
                footer.innerHTML = `
                    <td colspan="8" class="scroll-sentinel-cell scroll-end" style="text-align: center; padding: 14px 8px; font-weight: 600; color: #64748b; font-size: 0.8rem; background: transparent;">
                        <i class="fas fa-check-circle me-1" style="color:var(--success-color);"></i>
                        All ${latestData.length} records loaded
                    </td>`;
                tableBody.appendChild(footer);
            }
            if (paginationContainer) paginationContainer.innerHTML = '';
            if (pageInfo) pageInfo.textContent = '';
            renderNotificationsUI();
        }

    /* ── Mobile Infinite Scroll: Dashboard ─────────────────────────────── */
    let isDashboardBatchLoading = false;

    function appendDashboardBatch(tableBody) {
        if (!tableBody || isDashboardBatchLoading) return;
        const data = mobileDashboardAllData;
        const start = mobileDashboardLoadedCount;
        const end = Math.min(start + MOBILE_BATCH_SIZE, data.length);
        if (start >= data.length) return;

        isDashboardBatchLoading = true;

        // Remove existing sentinel if any
        const oldSentinel = tableBody.querySelector('.scroll-sentinel');
        if (oldSentinel) oldSentinel.remove();

        const fragment = document.createDocumentFragment();
        for (let i = start; i < end; i++) {
            const row = data[i];
            const sn = row.sn;
            const uniqueId = row[1];
            const date = row[2];
            const itemList = row[4];
            const amount = formatCurrency(row[5]);
            const creditDisplay = row[6] || '';
            const adminDisplay = row[7] || '';

            const tr = document.createElement('tr');
            tr.classList.add('infinite-row-in');
            tr.innerHTML = `
               <td data-label="S.N">${sn}</td>
                <td data-label="Unique ID">${uniqueId}</td>
                <td data-label="Date">${date}</td>
                <td data-label="Item List">${itemList}</td>
                <td data-label="Amount">${amount}</td>
                <td data-label="Credit & Remark">${formatCreditDisplay(creditDisplay, itemList)}</td>
                <td data-label="Admin">${adminDisplay}</td>
                <td data-label="Actions"></td>
            `;

            const actionTd = tr.querySelector('td:last-child');
            const viewBtn = document.createElement('button');
            viewBtn.className = 'action-btn text-info me-1';
            viewBtn.innerHTML = '<i class="fas fa-eye"></i>';
            viewBtn.title = 'View Entry';
            viewBtn.onclick = () => viewEntryInDashboard(CURRENT_MONTH, uniqueId);
            actionTd.appendChild(viewBtn);
            const editBtn = document.createElement('button');
            editBtn.className = 'action-btn text-primary me-1';
            editBtn.innerHTML = '<i class="fas fa-edit"></i>';
            editBtn.title = 'Edit Entry';
            editBtn.onclick = () => editEntry(uniqueId, CURRENT_MONTH);
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-btn text-danger';
            deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
            deleteBtn.title = 'Delete Entry';
            deleteBtn.onclick = () => openDeleteModal(uniqueId, CURRENT_MONTH);
            actionTd.appendChild(editBtn);
            actionTd.appendChild(deleteBtn);
            fragment.appendChild(tr);
        }
        tableBody.appendChild(fragment);
        mobileDashboardLoadedCount = end;
        isDashboardBatchLoading = false;

        // If more records exist, add a sentinel row to trigger next load
        if (end < data.length) {
            const sentinel = document.createElement('tr');
            sentinel.className = 'scroll-sentinel';
            sentinel.innerHTML = `
                <td colspan="8" class="scroll-sentinel-cell">
                    <span class="scroll-loading-dots"><i class="fas fa-circle-notch fa-spin"></i> Loading more…</span>
                    <span class="scroll-count-badge">${end} / ${data.length}</span>
                </td>`;
            tableBody.appendChild(sentinel);

            const container = tableBody.closest('.table-responsive');

            // Observe the sentinel using the table scroll area's viewport
            if (mobileDashboardObserver) mobileDashboardObserver.disconnect();
            mobileDashboardObserver = new IntersectionObserver((entries) => {
                if (entries[0] && entries[0].isIntersecting) {
                    mobileDashboardObserver.disconnect();
                    appendDashboardBatch(tableBody);
                }
            }, {
                root: container,
                rootMargin: '250px 0px 250px 0px',
                threshold: 0
            });
            mobileDashboardObserver.observe(sentinel);

            // Attach scroll listener fallback to container and window
            if (container && !container._hasMobileScrollListener) {
                container._hasMobileScrollListener = true;
                container.addEventListener('scroll', () => {
                    if (container.scrollHeight - container.scrollTop - container.clientHeight < 250) {
                        if (mobileDashboardLoadedCount < mobileDashboardAllData.length && !isDashboardBatchLoading) {
                            appendDashboardBatch(tableBody);
                        }
                    }
                }, { passive: true });
            }
        } else {
            // All loaded — show total count footer
            const footer = document.createElement('tr');
            footer.className = 'scroll-sentinel';
            footer.innerHTML = `
                <td colspan="8" class="scroll-sentinel-cell scroll-end">
                    <i class="fas fa-check-circle" style="color:var(--success-color);"></i>
                    All ${data.length} records loaded
                </td>`;
            tableBody.appendChild(footer);
        }
        if (typeof attachTableScrollGuards === 'function') attachTableScrollGuards();
    }

                    <span class="scroll-count-badge">${end} / ${data.length}</span>
                </td>`;
            tableBody.appendChild(sentinel);

            if (mobileReportsObserver) mobileReportsObserver.disconnect();
            mobileReportsObserver = new IntersectionObserver((entries) => {
                if (entries[0] && entries[0].isIntersecting) {
                    mobileReportsObserver.disconnect();
                    appendReportsBatch(tableBody);
                }
            }, {
                root: null,
                rootMargin: '250px 0px 250px 0px',
                threshold: 0
            });
            mobileReportsObserver.observe(sentinel);

            const container = tableBody.closest('.table-responsive');
            if (container && !container._hasMobileReportsScrollListener) {
                container._hasMobileReportsScrollListener = true;
                container.addEventListener('scroll', () => {
                    if (container.scrollHeight - container.scrollTop - container.clientHeight < 250) {
                        if (mobileReportsLoadedCount < mobileReportsAllData.length && !isReportsBatchLoading) {
                            appendReportsBatch(tableBody);
                        }
                    }
                }, { passive: true });
            }
        } else {
            const footer = document.createElement('tr');
            footer.className = 'scroll-sentinel';
            footer.innerHTML = `
                <td colspan="8" class="scroll-sentinel-cell scroll-end">
                    <i class="fas fa-check-circle" style="color:var(--success-color);"></i>
                    All ${data.length} records loaded
                </td>`;
            tableBody.appendChild(footer);
        }
    }

    function getFilteredDashboardData() {

        if (!expenseData) return [];
        if (!query || query.length === 0) return expenseData;
        return expenseData.filter(row => {
            const snText = String(row[0] || '').toLowerCase();
            const uidText = String(row[1] || '').toLowerCase();
            const dateText = String(row[2] || '').toLowerCase();
            const itemText = String(row[4] || '').toLowerCase();
            const amtText = String(row[5] || '').toLowerCase();
            const creditText = String(row[6] || '').toLowerCase();
            const adminText = String(row[7] || '').toLowerCase();
            return itemText.includes(query) || uidText.includes(query) || dateText.includes(query) || creditText.includes(query) || snText === query || amtText.includes(query) || adminText.includes(query);
        });

    function renderPagination(totalPages, currentPage, containerId, infoId, jsFunction) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const pagFnMap = {
            'goToDashboardPage': goToDashboardPage,
            'goToReportsPage': goToReportsPage
        };
        const pagFn = pagFnMap[jsFunction] || function () { };

        container.innerHTML = '';

        const wrapper = document.createElement('div');
        wrapper.className = 'pagination-custom-container d-flex align-items-center';
        wrapper.style.cssText = 'gap: 15px; margin-right: 15px;';

        // Previous button
        const prevBtn = document.createElement('button');
        prevBtn.className = 'pag-btn' + (currentPage === 1 ? ' disabled' : '');
        prevBtn.title = 'Previous Page';
        prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
        if (currentPage > 1) {
            prevBtn.addEventListener('click', function () { pagFn(currentPage - 1); });
        }
        wrapper.appendChild(prevBtn);

        // Page info
        const info = document.createElement('span');
        info.className = 'pag-info';
        info.textContent = 'Page ' + currentPage + ' / ' + totalPages;
        wrapper.appendChild(info);

        // Next button
        const nextBtn = document.createElement('button');
        nextBtn.className = 'pag-btn' + (currentPage === totalPages ? ' disabled' : '');
        nextBtn.title = 'Next Page';
        nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
        if (currentPage < totalPages) {
            nextBtn.addEventListener('click', function () { pagFn(currentPage + 1); });
        }
        wrapper.appendChild(nextBtn);

        container.appendChild(wrapper);

        const infoEl = document.getElementById(infoId);
        if (infoEl) infoEl.style.display = 'none';
    }


    // Load items list
    function loadItemsList() {
        const cacheKey = 'items_list';

        // 1. Invalidate stale cache if version changed so new items (Scooty Petrol, etc.) appear immediately
        const ITEMS_CACHE_VERSION = '2026_11_15_v5';
        if (localStorage.getItem('expense_items_cache_ver') !== ITEMS_CACHE_VERSION) {
            if (window.expenseCache) {
                window.expenseCache.invalidate(cacheKey);
            }
            localStorage.setItem('expense_items_cache_ver', ITEMS_CACHE_VERSION);
        }

        // 2. CHECK SERVER-INJECTED DATA
        if (window.SERVER_INITIAL_DATA && window.SERVER_INITIAL_DATA.itemsList) {
            const data = window.SERVER_INITIAL_DATA.itemsList;
            window.SERVER_INITIAL_DATA.itemsList = null; // Consume so future refreshes fetch fresh data
            if (window.expenseCache) window.expenseCache.set(cacheKey, data);
            handleItemsListData(data);
            return;
        }

        // 3. CHECK PERSISTENT CACHE (Render immediately for fast UI)
        const cachedData = window.expenseCache ? window.expenseCache.get(cacheKey) : null;
        if (cachedData) {
            handleItemsListData(cachedData);
        }

        // 4. ALWAYS FETCH FRESH IN BACKGROUND (Stale-while-revalidate from Google Sheet Col B & C)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((data) => {
                    if (data && (Array.isArray(data) ? data.length > 0 : (data.items && data.items.length > 0))) {
                        if (window.expenseCache) window.expenseCache.set(cacheKey, data);
                        handleItemsListData(data);
                    }
                })
                .withFailureHandler((error) => {
                    console.warn("Error loading items list from Google Sheet:", error);
                })
                .getItemList();
        }
    }

    function handleItemsListData(data) {
        let items = [];
        if (Array.isArray(data)) {
            items = data.map(item => {
                if (typeof item === 'object' && item !== null) {
                    if (item.name && item.category) {
                        itemCategoryMap[item.name.toLowerCase().trim()] = getCategoryWithIcon(item.category);
                    }
                    return getItemDisplayName(item.name || "");
                }
                return getItemDisplayName(item.trim());
            });
        } else if (data && typeof data === 'object') {
            if (data.items) {
                items = data.items.map(item => getItemDisplayName(item));
            }
            if (data.categoryMap) {
                for (const k in data.categoryMap) {
                    itemCategoryMap[k.toLowerCase().trim()] = getCategoryWithIcon(data.categoryMap[k]);
                }
            }
        }
        if (items && items.length > 0) {
            // MERGE with existing itemsList so default items (like Scooty Petrol, Bike Petrol, Car Petrol) are NEVER lost
            itemsList = [...new Set([...itemsList, ...items])].sort();
        }
        populateItemsDropdown();
        populateEnhancedItemFilter();
    }

    function getItemDisplayName(item) {
        if (!item) return '';
        var str = item.toString().trim();
        str = str.replace(/^[\s\uD800-\uDBFF\uDC00-\uDFFF\u2600-\u27BF\uFE00-\uFE0F\u200D\u2000-\u206F\u2B50\u231A-\u23FA\u25A0-\u25FF\u2B00-\u2BFF\u2190-\u21FF\u2300-\u23FF\u2900-\u297F]+/, '');
        str = str.replace(/^[^\w\s"'(+\-\u0900-\u097F]+/u, '');
        try {
            str = str.replace(/^[\p{Extended_Pictographic}\p{Emoji_Presentation}\p{Emoji}\s]+/u, '');
        } catch (e) { }
        return str.trim();
    }

    function renderResults(list) {
        const resultsContainer = document.getElementById('autocompleteResults');
        if (!resultsContainer) return;

        const searchVal = (document.getElementById('itemSearchInput')?.value || "").trim();

        if (list.length === 0) {
            resultsContainer.innerHTML = `
                <div class="autocomplete-item text-muted" style="padding: 10px 12px; font-size: 0.85rem;">No matching items found</div>
                <div class="autocomplete-item text-success fw-bold border-top" onclick="quickAddNewItem('${searchVal.replace(/'/g, "\\'")}')" style="padding: 10px 12px; cursor: pointer; background: #f0fdf4; font-size: 0.85rem;">
                    <i class="fas fa-plus-circle me-1"></i>+ Add "${searchVal}" to List sheet
                </div>
            `;
            resultsContainer.classList.remove('d-none');
            return;
        }

        resultsContainer.innerHTML = "";
        list.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item d-flex justify-content-between align-items-center' + (index === activeItemIndex ? ' active' : '');
            div.style.padding = '8px 12px';
            div.style.cursor = 'pointer';
            const clean = getItemDisplayName(item);
            const cat = getCategoryWithIcon(clean);
            div.innerHTML = `
                <span class="item-name fw-semibold" style="color: #1e293b;">${clean}</span>
                <span class="badge bg-light text-secondary border ms-2" style="font-size: 0.72rem; font-weight: 500;">${cat}</span>
            `;
            div.onclick = () => selectItem(item);
            resultsContainer.appendChild(div);
        });

        if (searchVal && !list.some(it => it.toLowerCase() === searchVal.toLowerCase())) {
            const addDiv = document.createElement('div');
            addDiv.className = 'autocomplete-item text-success fw-bold border-top';
            addDiv.style.padding = '8px 12px';
            addDiv.style.background = '#f0fdf4';
            addDiv.style.cursor = 'pointer';
            addDiv.innerHTML = `<i class="fas fa-plus-circle me-1"></i>+ Add "${searchVal}" to List sheet`;
            addDiv.onclick = () => quickAddNewItem(searchVal);
            resultsContainer.appendChild(addDiv);
        }

        resultsContainer.classList.remove('d-none');
    }

    function handleItemKeyDown(e) {
        const resultsContainer = document.getElementById('autocompleteResults');
        if (!resultsContainer || resultsContainer.classList.contains('d-none')) return;

        const items = resultsContainer.getElementsByClassName('autocomplete-item');
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeItemIndex = (activeItemIndex + 1) % items.length;
            updateActiveItem(items);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeItemIndex = (activeItemIndex - 1 + items.length) % items.length;
            updateActiveItem(items);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeItemIndex > -1) {
                selectItem(items[activeItemIndex].textContent);
            }
        }
    }

    function updateActiveItem(items) {
        for (let i = 0; i < items.length; i++) {
            items[i].classList.toggle('active', i === activeItemIndex);
        }
        if (activeItemIndex > -1) {
            items[activeItemIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    /**
     * Returns the best matching icon string for a given item name,
     * or an empty string if no match found.
     */
    function getIconForItem(name) {
        if (!name) return '';
        const lower = name.toLowerCase().trim();
        for (const entry of ITEM_ICON_MAP) {
            if (entry.keywords.some(kw => lower.includes(kw))) {
                return entry.icon;
            }
        }
        return '';
    }
    /**
     * Returns the category formatted with an appropriate icon and name (e.g. "📦 Amazon").
     */
    function getCategoryWithIcon(name) {
        if (!name) return '';
        const cleanName = getItemDisplayName(name).trim();
        if (!cleanName) return '';

        const lower = cleanName.toLowerCase();

        // 1. Direct match in List sheet category mapping (Col B -> Col C)
        if (typeof itemCategoryMap !== 'undefined' && itemCategoryMap[lower]) {
            return itemCategoryMap[lower];

            return DEFAULT_ITEM_CATEGORY_MAP[lower];

        const emojiRegex = /(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])/;

        const PRIMARY_CATEGORY_MAP = {

    /**
     * Formats the Credit & Remark column to always show proper category/item icons:
     * - Car Petrol, Bike Petrol, Scooty Petrol, Petrol, Fuel -> ⛽ Fuel
     * - Car Service, Bike Service, Scooty Service, Scooter Service, Service -> 🔧 Service
     * - All other categories/items -> Formatted with their verified icons
     */
    function formatCreditDisplay(credit, item) {
        const rawCredit = (credit || '').trim();
        const rawItem = (item || '').trim();
        if (!rawCredit && !rawItem) return '';

        const lowerCredit = rawCredit.toLowerCase();
        const lowerItem = rawItem.toLowerCase();

        // Priority 1: Service (car service, bike service, scooty service, scooter service, service)
        if (lowerCredit.includes('service') || lowerItem.includes('service')) {
            return '🔧 Service';
        }

        // Priority 2: Fuel / Petrol (car petrol, bike petrol, scooty petrol, scooter petrol, petrol, fuel, diesel, cng)
        if (lowerCredit.includes('petrol') || lowerCredit.includes('fuel') || lowerCredit.includes('diesel') || lowerCredit.includes('cng') ||
            lowerItem.includes('petrol') || lowerItem.includes('fuel') || lowerItem.includes('diesel') || lowerItem.includes('cng')) {
            return '⛽ Fuel';
        }

        // Priority 3: If credit already starts with an emoji, keep it
        const emojiRegex = /^(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])/;
        if (emojiRegex.test(rawCredit)) {
            return rawCredit;
        }

        // Priority 4: Look up category icon
        if (rawCredit) {
            return getCategoryWithIcon(rawCredit);
        }
        return getCategoryWithIcon(rawItem);
    }
    window.formatCreditDisplay = formatCreditDisplay;

    // Enhanced Reports Functions
    function loadEnhancedReports(isBackground = false) {
        const loadingSpinner = document.getElementById('reports-loading-spinner');
        const tableBody = document.getElementById('reports-table-body');

        const cacheKey = 'all_data';
        const cachedData = window.expenseCache ? window.expenseCache.get(cacheKey) : null;

        const dateFilter = document.getElementById('dateFilter');
        if (dateFilter && !dateFilter.value && !isBackground) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateFilter.value = `${yyyy}-${mm}-${dd}`;
        }

        // Instant render from cache (0ms delay), then background sync with Google Sheets
        if (cachedData) {
            handleEnhancedReportsData(cachedData);
            isBackground = true;
        }

        if (!isBackground) {
            if (loadingSpinner) loadingSpinner.classList.remove('d-none');
            if (tableBody) tableBody.innerHTML = '';
        }

        // Try to use Google Apps Script with fallback to mock data
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((data) => {
                    window.expenseCache.set(cacheKey, data);
                    handleEnhancedReportsData(data);
                })
                .withFailureHandler((error) => {
                    console.error("Google Apps Script error:", error);
                    if (loadingSpinner) loadingSpinner.classList.add('d-none');

                    // Use mock data as fallback
                    console.log("Falling back to mock data for reports");

                            (Math.random() * 500 + 50).toFixed(2), // amount

                            ['Admin', 'User'][i % 2], // admin
                            `ID${1000 + i}` // id

                    '2024',
                    ['Admin', 'User'][i % 2],
                    `ID${1000 + i}`
                ])
            };

        }
    }

    function handleEnhancedReportsData(response) {
        const loadingSpinner = document.getElementById('reports-loading-spinner');
        if (loadingSpinner) loadingSpinner.classList.add('d-none');

        if (response.error) {
            showAlert("Error: " + response.error, "danger");
            return;
        }

        allExpenseData = response.allExpenses || [];
        const totalRows = allExpenseData.length;
        enhancedAllData = allExpenseData.map((row, index) => {
            const masterSn = (row[8] !== undefined && row[8] !== null && row[8] !== "" && !isNaN(parseInt(row[8])))
                ? parseInt(row[8])
                : (totalRows - index);
            return {
                sn: masterSn,
                id: row[7] || "",
                date: row[0],
                month: row[1] || "",
                year: row[5] || "",
                item: row[2] || "",
                amount: parseFloat(row[3]) || 0,
                credit: row[4] || "",
                admin: row[6] || ""
            };
        });

        populateYearSelector();
        populateEnhancedItemFilter();
        enhancedFilterReports();

        // Apply table header freezing after data loads
        setTimeout(freezeTableHeaders, 100);
    }

    function enhancedFilterReports() {
        const itemFilter = document.getElementById('itemFilter');
        const monthFilter = document.getElementById('monthFilter');
        const yearFilter = document.getElementById('yearFilter');
        const amountFilter = document.getElementById('amountFilter');
        const quickSearch = document.getElementById('quickSearch');
        const tableBody = document.getElementById('reports-table-body');
        const filteredTotalElement = document.getElementById('filtered-total');
        const filteredCountElement = document.getElementById('filtered-count');

        if (!tableBody || !filteredTotalElement || !filteredCountElement) return;

        const itemFilterValue = itemFilter ? itemFilter.value : '';
        const monthFilterValue = monthFilter ? monthFilter.value : '';
        const yearFilterValue = yearFilter ? yearFilter.value : '';
        const amountFilterValue = amountFilter ? amountFilter.value : '';
        const dateFilter = document.getElementById('dateFilter');
        const dateFilterValue = dateFilter ? dateFilter.value : '';
        const searchValue = quickSearch ? quickSearch.value.toLowerCase() : '';

        let filteredData = enhancedAllData;

        // Auto-clear date filter if searching (requested by user)
        if (searchValue !== "" && dateFilter && dateFilter.value !== "") {
            dateFilter.value = "";
        }

        // Logic: If Year or Month filter is active, we should ignore the specific Date filter 
        // to prevent conflicts (e.g. searching for Year 2025 while Date is set to Today 2026).
        const activeDateValue = (searchValue !== "" || yearFilterValue !== "" || monthFilterValue !== "") ? "" : dateFilterValue;

        // Apply item filter
        if (itemFilterValue !== "") {
            filteredData = filteredData.filter(item => item.item === itemFilterValue);
        }

        // Apply month filter
        if (monthFilterValue !== "") {
            filteredData = filteredData.filter(item => item.month === monthFilterValue);
        }

        // Apply year filter (support all / empty for All Years)
        if (yearFilterValue !== "" && yearFilterValue !== "all") {
            filteredData = filteredData.filter(item => String(item.year) === String(yearFilterValue));
        }

        // Apply amount filter
        if (amountFilterValue !== "") {
            if (amountFilterValue === '0-500') {
                filteredData = filteredData.filter(item => item.amount <= 500);
            } else if (amountFilterValue === '501-1000') {
                filteredData = filteredData.filter(item => item.amount > 500 && item.amount <= 1000);
            } else if (amountFilterValue === '1001-5000') {
                filteredData = filteredData.filter(item => item.amount > 1000 && item.amount <= 5000);
            } else if (amountFilterValue === '5001+') {
                filteredData = filteredData.filter(item => item.amount > 5000);
            }
        }

        // Apply date filter
        if (activeDateValue !== "") {
            const [filterYear, filterMonth, filterDay] = activeDateValue.split('-').map(Number);
            const filterDateObj = new Date(filterYear, filterMonth - 1, filterDay);

            if (!isNaN(filterDateObj.getTime())) {
                const filterDateStr = filterDateObj.toDateString();
                filteredData = filteredData.filter(item => {
                    const itemDateObj = new Date(item.date);
                    return !isNaN(itemDateObj.getTime()) && itemDateObj.toDateString() === filterDateStr;
                });
            }
        }

        // Apply search filter
        if (searchValue !== "") {
            filteredData = filteredData.filter(item =>
                (item.sn && item.sn.toString().toLowerCase().includes(searchValue)) ||
                (item.id && item.id.toLowerCase().includes(searchValue)) ||
                (item.admin && item.admin.toLowerCase().includes(searchValue)) ||
                (item.credit && item.credit.toLowerCase().includes(searchValue)) ||
                item.item.toLowerCase().includes(searchValue) ||
                item.month.toLowerCase().includes(searchValue) ||
                item.year.includes(searchValue) ||
                item.amount.toString().includes(searchValue)
            );
        }

        // Calculate statistics
        const totalAmount = filteredData.reduce((sum, item) => sum + (item.amount || 0), 0);
        const averageAmount = filteredData.length > 0 ? totalAmount / filteredData.length : 0;
        const maxAmount = filteredData.length > 0 ? Math.max(...filteredData.map(item => item.amount || 0)) : 0;

        // Update stats cards (animated)
        const reportsTotal = document.getElementById('reports-total');
        const reportsCount = document.getElementById('reports-count');
        const reportsAverage = document.getElementById('reports-average');
        const reportsMax = document.getElementById('reports-max');

        animateValue(reportsTotal, totalAmount, 'currency');
        animateValue(reportsCount, filteredData.length, 'integer');
        animateValue(reportsAverage, averageAmount, 'currency');
        animateValue(reportsMax, maxAmount, 'currency');

        // Calculate Grand Total (All Years 2021-2026)
        const allDataTotalAmount = enhancedAllData.reduce((sum, item) => sum + (item.amount || 0), 0);
        const reportsYearTotal = document.getElementById('reports-year-total');
        animateValue(reportsYearTotal, allDataTotalAmount, 'currency');

        // Update filter stats
        filteredTotalElement.textContent = formatCurrency(totalAmount);
        filteredCountElement.textContent = filteredData.length;

        const headerAmountTotal = document.getElementById('header-amount-total');
        if (headerAmountTotal) headerAmountTotal.textContent = formatCurrency(totalAmount);

        // Check data consistency with yearly graphs
        checkDataConsistency(filteredData);

        globalFilteredReportsData = filteredData;
        currentReportsPage = 1;
        renderReportsTable();
    }

    function renderReportsTable() {
        const tableBody = document.getElementById('reports-table-body');
        const paginationContainer = document.getElementById('reports-pagination');
        const pageInfo = document.getElementById('reports-page-info');
        if (!tableBody) return;
        updateReportsSortIcons();

        let dataToRender = globalFilteredReportsData.map((item, index) => {
            return {
                ...item,
                sn: (item.sn !== undefined && item.sn !== null)
                    ? item.sn
                    : (globalFilteredReportsData.length - index)
            };
        });

        const activeSortCol = reportsSortCol || 'sn';
        const activeSortDir = reportsSortDir || 'desc';

        dataToRender.sort((a, b) => {
            let valA, valB;
            switch (activeSortCol) {
                case 'sn': valA = parseInt(a.sn) || 0; valB = parseInt(b.sn) || 0; break;
                case 'id': valA = String(a.id || ''); valB = String(b.id || ''); break;
                case 'date': {
                    valA = new Date(a.date).getTime() || 0;
                    valB = new Date(b.date).getTime() || 0;
                    if (valA === valB) {
                        const snA = parseInt(a.sn) || 0;
                        const snB = parseInt(b.sn) || 0;
                        return activeSortDir === 'asc' ? (snA - snB) : (snB - snA);
                    }
                    break;
                }
                case 'item': valA = String(a.item || ''); valB = String(b.item || ''); break;
                case 'amount': valA = parseFloat(a.amount) || 0; valB = parseFloat(b.amount) || 0; break;
                case 'credit': valA = String(a.credit || ''); valB = String(b.credit || ''); break;
                case 'admin': valA = String(a.admin || ''); valB = String(b.admin || ''); break;
                default:
                    valA = parseInt(a.sn) || 0; valB = parseInt(b.sn) || 0;
            }
            if (valA < valB) return activeSortDir === 'asc' ? -1 : 1;
            if (valA > valB) return activeSortDir === 'asc' ? 1 : -1;
            return 0;
        });

        const totalItems = dataToRender.length;
        const isMobileR = window.innerWidth <= 992 || (('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth <= 1024);

        if (isMobileR) {
            // Mobile: Infinite Scroll
            mobileReportsAllData = dataToRender;
            mobileReportsLoadedCount = 0;
            if (mobileReportsObserver) mobileReportsObserver.disconnect();
            tableBody.innerHTML = '';
            if (dataToRender.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="text-center py-4"><i class="fas fa-inbox fa-2x mb-3 text-muted"></i><p class="mb-0">No data found for the selected filters</p></td></tr>`;
                if (paginationContainer) paginationContainer.innerHTML = '';
                if (pageInfo) pageInfo.textContent = '';
            } else {
                appendReportsBatch(tableBody);
                renderNotificationsUI();
            }
            setTimeout(freezeTableHeaders, 50);
            return;
        }

        const totalPages = Math.ceil(totalItems / REPORTS_PER_PAGE) || 1;

        if (currentReportsPage > totalPages) currentReportsPage = totalPages;

        const startIndex = (currentReportsPage - 1) * REPORTS_PER_PAGE;
        const endIndex = startIndex + REPORTS_PER_PAGE;
        const pageData = dataToRender.slice(startIndex, endIndex);

        // Render table
        if (pageData.length === 0) {
            tableBody.innerHTML = `
<tr>
<td colspan="8" class="text-center py-4">
<i class="fas fa-inbox fa-2x mb-3 text-muted"></i>
<p class="mb-0">No data found for the selected filters</p>
</td>
</tr>
`;
            if (paginationContainer) paginationContainer.innerHTML = '';
            if (pageInfo) pageInfo.textContent = '';
        } else {
            tableBody.innerHTML = '';
            pageData.forEach((item, index) => {
                const sn = item.sn;
                const monthName = item.month || CURRENT_MONTH;
                const uniqueIdValue = item.id || item.uniqueId;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="S.N">${sn}</td>
                    <td data-label="Unique ID">${uniqueIdValue || ''}</td>
                    <td data-label="Date">${formatDisplayDate(item.date)}</td>
                    <td data-label="Item List" style="text-align: left !important;">${item.item}</td>
                    <td data-label="Amount"><strong class="report-amount-text">${formatCurrency(item.amount)}</strong></td>
                    <td data-label="Credit">${formatCreditDisplay(item.credit, item.item)}</td>
                    <td data-label="Admin">${item.admin || ''}</td>
                    <td data-label="Actions" style="white-space: nowrap;"></td>
                `;

                const actionTd = tr.querySelector('td:last-child');

                const viewBtn = document.createElement('button');
                viewBtn.className = 'action-btn text-info me-1';
                viewBtn.innerHTML = '<i class="fas fa-eye"></i>';
                viewBtn.title = 'View Entry';
                viewBtn.onclick = () => showViewModal([
                    null,
                    uniqueIdValue,
                    item.date,
                    monthName,
                    item.item,
                    item.amount,
                    item.credit || '',
                    item.admin || ''
                ]);

                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn text-primary me-1';
                editBtn.innerHTML = '<i class="fas fa-edit"></i>';
                editBtn.title = 'Edit Entry';
                editBtn.onclick = () => editEntry(uniqueIdValue, monthName);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'action-btn text-danger';
                deleteBtn.setAttribute('data-bs-toggle', 'modal');
                deleteBtn.setAttribute('data-bs-target', '#confirmationModal');
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';

                tableBody.appendChild(tr);

            renderPagination(totalPages, currentReportsPage, 'reports-pagination', 'reports-page-info', 'goToReportsPage');

    const USER_NOTIF_KEY = 'expense_user_new_items_notifications_v3';

    function getStoredNotifications() {
        try {
            const raw = localStorage.getItem(USER_NOTIF_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return parsed.filter(n => n && !n.cleared);
        } catch (e) {
            console.warn("Error reading notifications:", e);
            return [];
        }
    }

    function saveStoredNotifications(notifs) {
        try {
            localStorage.setItem(USER_NOTIF_KEY, JSON.stringify(notifs || []));
        } catch (e) {
            console.warn("Error saving notifications:", e);
        }
    }

    function clearNotificationHistory(type) {
        // Permanently clear: empty list so they never appear again
        saveStoredNotifications([]);
        renderNotificationsUI();
        document.querySelectorAll('.notification-dropdown').forEach(d => d.classList.remove('show'));
    }

    function toggleNotifications(type) {
        const dropdown = document.getElementById(`${type}-notification-dropdown`);
        if (!dropdown) return;
        const isVisible = dropdown.classList.contains('show');

        // Close all dropdowns
        document.querySelectorAll('.notification-dropdown').forEach(d => d.classList.remove('show'));

        if (!isVisible) {
            // Mark all active notifications as seen
            const notifs = getStoredNotifications();
            let changed = false;
            notifs.forEach(n => {
                if (!n.seen) {
                    n.seen = true;
                    changed = true;
                }
            });
            if (changed) {
                saveStoredNotifications(notifs);
            }

            renderNotificationsUI();
            dropdown.classList.add('show');
        }
    }

    function checkDataConsistency(filteredData) {
        const consistencyElement = document.getElementById('data-consistency');
        if (!consistencyElement) return;

        // Get current year data for comparison
        const currentYear = getCurrentYear();
        const yearSelector = document.getElementById('year-selector');
        const selectedYear = yearSelector ? yearSelector.value : currentYear;

        // Calculate total from reports for selected year
        const reportsYearTotal = filteredData
            .filter(item => item.year === selectedYear)
            .reduce((sum, item) => sum + (item.amount || 0), 0);

        // Get yearly data for comparison
        const yearlyData = calculateYearlyDataFromAllData(selectedYear);
        const graphsYearTotal = yearlyData.Total || 0;

        // Check consistency (allow small differences due to rounding)
        const isConsistent = Math.abs(reportsYearTotal - graphsYearTotal) < 1;

        if (isConsistent) {
            consistencyElement.className = 'data-consistency-check data-consistent';
            consistencyElement.innerHTML = '<i class="fas fa-check-circle"></i> Data Consistent';
        } else {
            consistencyElement.className = 'data-consistency-check data-inconsistent';
            consistencyElement.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Data Inconsistent';
        }
    }
