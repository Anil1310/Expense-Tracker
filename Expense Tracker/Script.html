    function exportFilteredData() {
        const itemFilter = document.getElementById('itemFilter');
        const monthFilter = document.getElementById('monthFilter');
        const yearFilter = document.getElementById('yearFilter');
        const amountFilter = document.getElementById('amountFilter');
        const dateFilter = document.getElementById('dateFilter');
        const quickSearch = document.getElementById('quickSearch');

        const itemFilterValue = itemFilter ? itemFilter.value : '';
        const monthFilterValue = monthFilter ? monthFilter.value : '';
        const yearFilterValue = yearFilter ? yearFilter.value : '';
        const amountFilterValue = amountFilter ? amountFilter.value : '';
        const dateFilterValue = dateFilter ? dateFilter.value : '';
        const searchValue = quickSearch ? quickSearch.value.toLowerCase() : '';

        // Auto-clear date criteria if searching (requested by user)
        const activeDateValue = (searchValue !== "") ? "" : dateFilterValue;

        let filteredData = enhancedAllData;

        if (itemFilterValue !== "") {
            filteredData = filteredData.filter(item => item.item === itemFilterValue);
        }
        if (monthFilterValue !== "") {
            filteredData = filteredData.filter(item => item.month === monthFilterValue);
        }
        if (yearFilterValue !== "") {
            filteredData = filteredData.filter(item => item.year === yearFilterValue);
        }
        if (amountFilterValue !== "") {
            if (amountFilterValue === '0-500') {
                filteredData = filteredData.filter(item => item.amount <= 500);
            } else if (amountFilterValue === '501-1000') {
                filteredData = filteredData.filter(item => item.amount > 500 && item.amount <= 1000);
            } else if (amountFilterValue === '1001-5000') {
                filteredData = filteredData.filter(item => item.amount > 1000 && item.amount <= 5000);
            } else if (amountFilterValue === '5001+') {
                filteredData = filteredData.filter(item => item.amount > 5000);
            }
        }

        // Apply date filter
        if (activeDateValue !== "") {
            const [filterYear, filterMonth, filterDay] = activeDateValue.split('-').map(Number);
            const filterDateObj = new Date(filterYear, filterMonth - 1, filterDay);

            if (!isNaN(filterDateObj.getTime())) {
                const filterDateStr = filterDateObj.toDateString();
                filteredData = filteredData.filter(item => {
                    const itemDateObj = new Date(item.date);
                    return !isNaN(itemDateObj.getTime()) && itemDateObj.toDateString() === filterDateStr;
                });
            }
        }
        if (searchValue !== "") {
            filteredData = filteredData.filter(item =>
                item.item.toLowerCase().includes(searchValue) ||
                item.month.toLowerCase().includes(searchValue) ||
                item.year.includes(searchValue) ||
                item.amount.toString().includes(searchValue)
            );
        }

        if (filteredData.length === 0) {
            showAlert("No Data 2 Export!", "warning");
            return;
        }

        // Create CSV content
        let csvContent = "ID,Date,Month,Year,Item,Amount,Credit\n";
        filteredData.forEach(item => {
            csvContent += `${item.id},"${item.date}","${item.month}","${item.year}","${item.item}",${item.amount},"${item.credit ? 'Yes' : 'No'}"\n`;
        });

        const fileName = `Filtered_Export_${new Date().toISOString().slice(0, 10)}.csv`;
        downloadCSV(csvContent, fileName);
    }

    function renderDataTable(data) {

    // ── Instant Client-Side Computations from In-Memory all_data (0ms Page Loading) ──
    function extractMonthlyDataFromAllData(allExpenses, targetMonth, targetYear) {
        if (!allExpenses || !Array.isArray(allExpenses)) return null;
        const normTarget = String(targetMonth || "").toLowerCase().trim();
        const yearStr = String(targetYear || (typeof CURRENT_YEAR !== 'undefined' ? CURRENT_YEAR : new Date().getFullYear())).trim();
        const isAll = normTarget === 'all' || normTarget === '';

        // Filter strictly by current year (2026) and selected month (or all 12 months)
        const monthRows = allExpenses.filter(r => {
            const rowYear = String(r[5] || '').trim();
            const yearMatches = !rowYear || rowYear === yearStr;
            if (!yearMatches) return false;

            if (isAll) return true;
            return String(r[1] || "").toLowerCase().trim() === normTarget;
        });

        // Sort chronologically ascending (e.g. Apr 1 -> Apr 30, S.N 1 -> 140)
        monthRows.sort((a, b) => {
            const numA = parseInt(String(a[7] || '').split('-')[0]) || 0;
            const numB = parseInt(String(b[7] || '').split('-')[0]) || 0;
            if (numA && numB) return numA - numB;
            try {
                const dateA = new Date(a[0]);
                const dateB = new Date(b[0]);
                if (!isNaN(dateA.getTime()) && !isNaN(dateB.getTime())) {
                    const diff = dateA - dateB;
                    if (diff !== 0) return diff;
                }
            } catch (e) { }
            return 0;
        });

        let totalExpenses = 0;
        const categories = new Set();
        const days = new Set();
        const tableData = monthRows.map((r, idx) => {
            const amt = parseFloat(r[3]) || 0;
            totalExpenses += amt;
            if (r[4]) categories.add(r[4]);
            if (r[0]) days.add(r[0]);
            const parsedSn = parseInt(String(r[7] || '').split('-')[0]);
            const sn = (!isNaN(parsedSn) && parsedSn > 0) ? parsedSn : (idx + 1);
            return [
                sn,
                r[7] || `${sn}-${r[2] || 'Expense'}`,
                r[0] || '',
                r[1] || targetMonth,
                r[2] || '',
                amt,
                r[4] || '',
                r[6] || ''
            ];
        });

        return {
            totalExpenses: totalExpenses,
            uniqueCategories: categories.size,
            daysWithExpenses: days.size,
            tableData: tableData
        };
    }

    function calculateSummaryDataFromAllData(allExpenses, year) {
        if (!allExpenses || !Array.isArray(allExpenses) || allExpenses.length === 0) return null;
        const isAllYears = (!year || year === 'all');
        const targetYear = isAllYears ? '' : year.toString();

        let totalAmount = 0;
        const monthlyTotals = {};
        const categoryTotals = {};
        const paymentMethods = { 'Credit': 0, 'Cash': 0 };
        const yearlyCategoryCounts = {};
        const userTotals = {};

        allExpenses.forEach(expense => {
            const amount = parseFloat(expense[3]) || 0;
            const month = expense[1];
            const category = expense[2] || "Uncategorized";

            const creditStr = String(expense[4] || '').toLowerCase();
            const credit = (creditStr.includes('✓') || creditStr.includes('credit')) ? 'Credit' : 'Cash';
            const rowYear = String(expense[5] || '');

            if (isAllYears || rowYear === targetYear) {
                totalAmount += amount;
                if (month) monthlyTotals[month] = (monthlyTotals[month] || 0) + amount;
                categoryTotals[category] = (categoryTotals[category] || 0) + amount;
                yearlyCategoryCounts[category] = (yearlyCategoryCounts[category] || 0) + 1;
                paymentMethods[credit] = (paymentMethods[credit] || 0) + amount;

                const user = expense[6] || 'Admin';
                userTotals[user] = (userTotals[user] || 0) + amount;
            }
        });

        const currentYearTotal = totalAmount;

        const topCategories = Object.entries(categoryTotals)
            .map(([cat, amt]) => ({
                category: cat,
                total: amt,
                percentage: currentYearTotal > 0 ? parseFloat(((amt / currentYearTotal) * 100).toFixed(1)) : 0,
                transactions: yearlyCategoryCounts[cat] || 0,
                avgPer: yearlyCategoryCounts[cat] ? amt / yearlyCategoryCounts[cat] : 0
            }))
            .sort((a, b) => b.total - a.total)
            .slice(0, 5);

        const catDist = Object.entries(categoryTotals)
            .map(([cat, amt]) => ({
                category: cat,
                percentage: currentYearTotal > 0 ? parseFloat(((amt / currentYearTotal) * 100).toFixed(1)) : 0
            }))
            .sort((a, b) => b.percentage - a.percentage)
            .slice(0, 5);

        const payMethods = Object.entries(paymentMethods)
            .map(([method, amt]) => ({
                method: method,
                amount: amt,
                percentage: currentYearTotal > 0 ? parseFloat(((amt / currentYearTotal) * 100).toFixed(1)) : 0
            }));

        const monthsArr = Object.entries(monthlyTotals)
            .map(([m, amt]) => ({ month: m, amount: amt }))
            .sort((a, b) => b.amount - a.amount);

        const highest = monthsArr.length > 0 ? monthsArr[0] : { month: '-', amount: 0 };
        const lowest = monthsArr.length > 0 ? monthsArr[monthsArr.length - 1] : { month: '-', amount: 0 };

        const monthlyComparison = MONTHS.map(m => {
            const amt = monthlyTotals[m] || 0;
            return {
                month: m,
                total: amt,
                dailyAvg: amt / 30,
                transactions: 0,
                categories: 0,
                trend: amt > (currentYearTotal / 12) ? 'up' : 'down'
            };
        });

        const userSpending = Object.entries(userTotals).map(([user, amt]) => ({
            user: user,
            amount: amt,
            percentage: currentYearTotal > 0 ? parseFloat(((amt / currentYearTotal) * 100).toFixed(1)) : 0
        }));

        return {
            yearlyTotal: currentYearTotal,
            monthlyAverage: currentYearTotal / 12,
            highestMonth: highest,
            lowestMonth: lowest,
            categoryDistribution: catDist,
            userSpending: userSpending.length > 0 ? userSpending : [{ user: 'Admin', amount: currentYearTotal, percentage: 100 }],
            paymentMethods: payMethods,
            monthlyComparison: monthlyComparison,
            topCategories: topCategories
        };
    }

    function calculateYearlyDataFromAllData(year) {
        const targetYear = year || getCurrentYear();

        MONTHS.forEach(month => yearlyData[month] = 0);

                }
            });

        MONTHS.forEach(month => {
            yearlyData[month] = parseFloat(yearlyData[month].toFixed(2));
        });

        yearlyData["Total"] = parseFloat(yearlyTotal.toFixed(2));
        yearlyData["Year"] = targetYear;

        return yearlyData;
    }

    // Entry CRUD operations
    function populateModalWithData(rowData) {
        if (!rowData) return;
        try {
            // Parse the exact date from the sheet to display it correctly in the modal
            let formattedDate = "";
            const dateStr = rowData[2] ? String(rowData[2]).trim() : "";

            if (dateStr) {
                let parsedDate = null;

                // First check if it's strictly DD-MM-YYYY to avoid US date parsing mixup (e.g. 10-05-2026 being parsed as Oct 5)
                if (dateStr.match(/^\d{2}-\d{2}-\d{4}$/)) {
                    const parts = dateStr.split('-');
                    formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
                } else {
                    const dateObj = new Date(dateStr);
                    if (!isNaN(dateObj.getTime())) {
                        let year = dateObj.getFullYear();

                        const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
                        const day = dateObj.getDate().toString().padStart(2, '0');

                        // Format as YYYY-MM-DD for the HTML5 date input
                        formattedDate = `${year.toString().padStart(4, '0')}-${month}-${day}`;
                    } else {
                        // Fallback for formats JS Date might not understand natively
                        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        const dateParts = dateStr.replace(/,/g, '').split(/[ \-\/]/);

                        if (dateParts.length >= 3) {
                            let year = 2026;
                            let month = "01";
                            let day = "01";

                            for (let part of dateParts) {
                                if (part.length === 4 && !isNaN(part)) year = part;
                                else if (monthNames.includes(part)) month = (monthNames.indexOf(part) + 1).toString().padStart(2, '0');
                                else if (!isNaN(part) && part.length <= 2) {
                                    if (!monthNames.some(m => dateParts.includes(m)) && month === "01" && parseInt(part) <= 12) month = part.padStart(2, '0');
                                    else day = part.padStart(2, '0');
                                }
                            }
                            formattedDate = `${year}-${month}-${day}`;
                        }
                    }
                }
            }

            const editUniqueId = document.getElementById('editUniqueId');
            const editMonth = document.getElementById('editMonth');
            const itemList = document.getElementById('itemList');
            const amount = document.getElementById('amount');
            const date = document.getElementById('date');
            const credit = document.getElementById('credit');
            const modalTitle = document.getElementById('modalTitle');

            if (editUniqueId) editUniqueId.value = rowData[1];
            if (editMonth) editMonth.value = rowData[3] || CURRENT_MONTH;
            if (itemList) itemList.value = getItemDisplayName(rowData[4]);
            if (amount) amount.value = isNaN(parseFloat(rowData[5])) ? '' : parseFloat(rowData[5]);
            if (date) date.value = formattedDate;
            if (credit) credit.value = rowData[6] || "";

            if (modalTitle) modalTitle.innerHTML = '<i class="fas fa-edit me-2"></i>Edit Expense Entry';
        } catch (e) {
            console.error("Error populating modal data:", e);
            showAlert("Error preparing data for edit.", "danger");
        }
    }

                                    cached.tableData.unshift(optimisticRow);
                                } else {
                                    const rIdx = cached.tableData.findIndex(r => r && String(r[1]).trim() === String(uniqueIdValue).trim());
                                    if (rIdx > -1) {
                                        cached.tableData[rIdx] = [
                                            confirmedSn,
                                            confirmedUid,
                                            formattedDisplayDate,
                                            monthValue,
                                            itemListValue,
                                            amountValue,
                                            creditValue || '',
                                            entryUser
                                        ];
                                    }
                                }
                                cached.totalExpenses = cached.tableData.reduce((sum, r) => sum + (parseFloat(r[5]) || 0), 0);
                                window.expenseCache.set(cacheKey, cached);
                                window.expenseCache.set(`monthly_${monthValue}`, cached);
                            }
                            window.expenseCache.invalidate('all_data');
                            window.expenseCache.invalidate('consolidated_data');
                        }

                        // Push notification
                        try {
                            pushExpenseNotification({
                                item: itemListValue,
                                amount: amountValue,
                                date: dateValue,
                                credit: creditValue,
                                month: monthValue
                            });
                        } catch (e) { }
                    } else {
                        console.warn("Save response warning:", res);
                        if (window.SyncEngine) window.SyncEngine.updateSyncUI('pending');
                    }
                })
                .withFailureHandler((err) => {
                    console.warn("Save deferred to background sync queue:", err);
                    isSavingRecordInProgress = false;
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = originalBtnHtml;
                    }
                    if (window.SyncEngine) {
                        window.SyncEngine.updateSyncUI('pending');
                    }
                    showModernToast("Saved on Device", "Saved locally. Google Sheets sync running in background.", "info", 3500);
                });

            if (isEdit) {
                runner.updateEntry(entryData);
            } else {

        } else {

                    animateValue(totalDaysEl, days.size, 'integer');
                }
            }
        }

        // B) If on Reports page:
        if (typeof enhancedAllData !== 'undefined' && Array.isArray(enhancedAllData)) {
            const repIdx = enhancedAllData.findIndex(r => r && String(r.id).trim() === String(uidToDelete).trim());
            if (repIdx > -1) {
                enhancedAllData.splice(repIdx, 1);
                if (typeof enhancedFilterReports === 'function') {
                    enhancedFilterReports();
                }
            }
        }

        // C) Invalidate cache
        if (window.expenseCache) {
            window.expenseCache.invalidateAll();
        }

        showModernToast("Record Deleted", `Removed ${uidToDelete}`, "success", 2500);

        let user = (typeof currentUser !== 'undefined' && currentUser) ? currentUser.name : 'Unknown';
        if (user.toLowerCase() === 'admin') {
            user = 'Anil Chahar';
        } else if (user.toLowerCase() === 'user') {
            user = 'Radhika Chahar';
        }

        // 3. RUN BACKEND DELETE ASYNCHRONOUSLY
        const runner = (typeof google !== 'undefined' && google.script && google.script.run)
            ? google.script.run
            : {
                withSuccessHandler: function (cb) { this._s = cb; return this; },
                withFailureHandler: function (cb) { this._f = cb; return this; },
                deleteEntry: function () { setTimeout(() => this._s({ success: true }), 300); }
            };

        runner
            .withSuccessHandler((response) => {
                if (!response || !response.success) {
                    showModernToast("Delete Sync Issue", "Entry deleted locally but server reported: " + (response ? response.error : "Unknown"), "warning", 4000);
                    autoRefreshData();
                }
            })
            .withFailureHandler((err) => {
                console.error("Delete background error:", err);
                showModernToast("Sync Error", "Could not complete delete on server. Please check network.", "error", 4000);
                autoRefreshData();
            })
            .deleteEntry(uidToDelete, monthToDelete, user);

        window.pendingDeleteUniqueId = null;
        window.pendingDeleteMonth = null;
    }

    function exportMonth(monthName) {
        try {
            const targetMonth = monthName || CURRENT_MONTH;
            let dataSource = [];

            if (targetMonth === CURRENT_MONTH) {
                // Use active dashboard data
                dataSource = expenseData.map((row, idx) => ({
                    sn: row[0] || (idx + 1),
                    id: row[1] || '',
                    date: row[2] || '',
                    month: row[3] || CURRENT_MONTH,
                    item: row[4] || '',
                    amount: parseFloat(row[5]) || 0,
                    remark: row[6] || ''
                }));
            } else if (enhancedAllData && enhancedAllData.length > 0) {
                // Filter from reports database
                const filtered = enhancedAllData.filter(item => item.month === targetMonth);
                dataSource = filtered.map((item, idx) => ({
                    sn: idx + 1,
                    id: item.id || '',
                    date: item.date || '',
                    month: item.month || targetMonth,
                    item: item.item || '',
                    amount: parseFloat(item.amount) || 0,
                    remark: item.credit || ''
                }));
            }

            if (dataSource.length === 0) {
                showAlert(`No data available to export for ${targetMonth}`, "warning");
                return;
            }

            // Generate Excel file using SheetJS
            const headers = ["S.N.", "Unique ID", "Date", "Month", "Item List", "Amount", "Credit/Remark"];
            const rows = dataSource.map(item => [
                item.sn,
                item.id,
                item.date,
                item.month,
                item.item,
                item.amount,
                item.remark
            ]);

            const data = [headers, ...rows];
            const ws = XLSX.utils.aoa_to_sheet(data);

            // Adjust column widths automatically
            const colWidths = headers.map((h, i) => {
                let maxLen = h.length;
                rows.forEach(r => {
                    const val = String(r[i] || '');
                    if (val.length > maxLen) maxLen = val.length;
                });
                return { wch: maxLen + 3 };
            });
            ws['!cols'] = colWidths;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, targetMonth);
            XLSX.writeFile(wb, `Expenses_${targetMonth}_${new Date().getFullYear()}.xlsx`);

            showAlert(`Successfully exported ${targetMonth} expenses to Excel!`, "success");
        } catch (e) {
            console.error("Export month failed:", e);
            showAlert("Excel Export failed: " + e.message, "danger");
        }
    }

    function downloadExcelBase64(base64Data, fileName) {
        try {
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 200);
        } catch (e) {
            console.error("Base64 Excel download failed:", e);
            showAlert("Export download failed: " + e.message, "danger");
        }
    }

    function downloadCSV(csvContent, fileName) {
        try {
            // Primary: Blob URL (works in most browsers + modern WebViews)
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 200);
        } catch (e) {
            // Fallback: data URI (works in restricted WebViews)
            const encoded = encodeURIComponent(csvContent);
            const dataUri = 'data:text/csv;charset=utf-8,' + encoded;
            const a = document.createElement('a');
            a.href = dataUri;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

            if (r.includes('shopping') || r.includes('amazon') || r.includes('grocery') || r.includes('cloth')) return '🛍️ ';
            if (r.includes('electronics') || r.includes('electronic') || r.includes('tv') || r.includes('mobile') || r.includes('laptop')) return '💻 ';
            if (r.includes('other')) return '📌 ';
            return '📝 ';
        };

        const formatDate = (dateStr) => {
            try {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch (e) { return dateStr; }
        };

        let tableRows = '';
        if (dataSource.length === 0) {
            tableRows = `<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:28px;">No expense records for ${month}.</td></tr>`;
        } else {
            dataSource.forEach((item, idx) => {
                const sn = item.sn;
                const id = item.id;
                const date = formatDate(item.date);
                const category = item.category;
                const amount = item.amount;
                const remark = item.remark;

                const amtNum = Math.round(parseFloat(String(amount).replace(/[^\d.-]/g, '')) || 0);
                const amtFmt = '₹' + amtNum.toLocaleString('en-IN');

                const toProperCase = (str) => {

                    return str.toString().toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');

        });

        const sortedItems = Object.keys(itemSums).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

        let summaryTableRows = '';
        sortedItems.forEach(cat => {

                <tr>

            try {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            } catch (e) {
                console.warn("Direct iframe print failed, trying print fallback:", e);
                try {
                    const htmlContent = iframe.contentDocument ? iframe.contentDocument.documentElement.outerHTML : '';
                    if (htmlContent) {
                        const blob = new Blob([htmlContent], { type: 'text/html' });
                        const blobUrl = URL.createObjectURL(blob);
                        const win = window.open(blobUrl, '_blank');
                        if (win) {
                            win.onload = () => {
                                win.focus();
                                win.print();
                            };
                        } else {
                            window.location.href = blobUrl;
                        }
                    }
                } catch (err) {
                    console.error("Print fallback failed:", err);
                    alert("Print failed: " + e.message);
                }
            }
        }

    function restoreEntryFromTrash(uniqueId, btn) {
        if (!uniqueId) return;
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        google.script.run
            .withSuccessHandler((response) => {
                if (response && response.success) {
                    // Remove the row from the table
                    const tr = btn.closest('tr');
                    if (tr) {
                        tr.style.transition = 'opacity 0.4s, transform 0.4s';
                        tr.style.opacity = '0';
                        tr.style.transform = 'translateX(40px)';
                        setTimeout(() => {
                            tr.remove();
                            // Check if table is empty now
                            const tbody = document.getElementById('trash-table-body');
                            if (tbody && tbody.children.length === 0) {
                                document.getElementById('trash-table').style.display = 'none';
                                document.getElementById('trash-empty').style.display = 'block';
                            }
                        }, 400);
                    }
                    showAlert(`✅ Entry restored to ${response.month || 'original month'} successfully!`, 'success');
                    if (window.expenseCache) window.expenseCache.invalidateAll();
                    autoRefreshData();
                } else {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                    showAlert('Error: ' + (response ? response.error : 'Restore failed'), 'danger');
                }
            })
            .withFailureHandler((err) => {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                handleError(err);
            })
            .restoreEntry(uniqueId);
    }

    function saveNewItem() {
        const itemNameInput = document.getElementById('newItemName');
        const categoryInput = document.getElementById('itemCategory');
        const addToDropdownInput = document.getElementById('addToDropdown');

        if (!itemNameInput) return;

        const itemName = itemNameInput.value.trim();
        const category = categoryInput ? categoryInput.value : '';
        const addToDropdown = addToDropdownInput ? addToDropdownInput.checked : true;

        if (!itemName) {
            showAlert("Please enter an item name!", "warning");
            itemNameInput.focus();
            return;
        }

        // Check if item already exists in the list
        if (itemsList.includes(itemName)) {
            showAlert(`Item "${itemName}" already exists in the list!`, "warning");
            return;
        }

        // Show loading state
        const saveBtn = document.querySelector('#addItemModal .btn-success');
        if (saveBtn) {
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Saving...';
            saveBtn.disabled = true;
        }

        // Call Google Apps Script function to add item
        google.script.run
            .withSuccessHandler(function (response) {
                if (response.success) {
                    // Add to local items list
                    itemsList.push(itemName);
                    itemsList.sort();

                    // Update dropdowns if requested
                    if (addToDropdown) {
                        updateItemDropdowns(itemName);
                    }

                    const cleanName = getItemDisplayName(itemName);
                    const catWithIcon = getCategoryWithIcon(category || response.category || cleanName);

                    // Add to local itemsList and itemCategoryMap
                    if (!itemsList.includes(cleanName)) {
                        itemsList.push(cleanName);
                        itemsList.sort();
                    }
                    if (typeof itemCategoryMap !== 'undefined') {
                        itemCategoryMap[cleanName.toLowerCase()] = catWithIcon;
                    }

                    // Auto-fill into open Add New Record modal (#entryModal)
                    const itemSearchInput = document.getElementById('itemSearchInput');
                    const itemList = document.getElementById('itemList');
                    const credit = document.getElementById('credit');
                    if (itemSearchInput) itemSearchInput.value = cleanName;
                    if (itemList) itemList.value = cleanName;
                    if (credit) credit.value = catWithIcon;

                    // Clear form and close modal
                    if (itemNameInput) itemNameInput.value = '';
                    if (categoryInput) categoryInput.value = '';
                    if (addToDropdownInput) addToDropdownInput.checked = true;

                    const modalElement = document.getElementById('addItemModal');
                    if (modalElement) {
                        const modal = bootstrap.Modal.getInstance(modalElement);
                        if (modal) modal.hide();
                    }

                    showAlert(response.message || `Item "${itemName}" added successfully!`, "success");

                    // Push notification for newly added item to List sheet
                    if (typeof pushNewItemNotification === 'function') {
                        pushNewItemNotification({
                            item: cleanName || itemName,
                            category: catWithIcon || category
                        });
                    }

                    // Refresh items list in cache
                    if (window.expenseCache) {
                        window.expenseCache.set('items_list', itemsList);
                    }

                } else {
                    showAlert("Error: " + (response.error || "Failed to add item"), "danger");
                }

                // Restore button state
                if (saveBtn) {
                    saveBtn.innerHTML = '<i class="fas fa-save me-1"></i>Save Item';
                    saveBtn.disabled = false;
                }
            })
            .withFailureHandler(function (error) {
                showAlert("Error adding item: " + error.message, "danger");
                console.error("Error adding item:", error);

                // Restore button state
                const saveBtn = document.querySelector('#addItemModal .btn-success');
                if (saveBtn) {
                    saveBtn.innerHTML = '<i class="fas fa-save me-1"></i>Save Item';
                    saveBtn.disabled = false;
                }
            })
            .addItemToList(itemName, category);

    function updateItemDropdowns(newItem) {
        // Update item dropdown in entry modal
        const itemDropdown = document.getElementById('itemListDropdown');
        if (itemDropdown) {
            // Remove empty option if it's the only one
            if (itemDropdown.options.length === 1 && itemDropdown.options[0].value === "") {
                itemDropdown.innerHTML = '';
            }

            // Add new item in alphabetical order
            let added = false;
            for (let i = 0; i < itemDropdown.options.length; i++) {
                if (newItem.toLowerCase() < itemDropdown.options[i].text.toLowerCase()) {
                    const option = document.createElement('option');
                    option.value = newItem;
                    option.textContent = newItem;
                    itemDropdown.add(option, i);
                    added = true;
                    break;
                }
            }

            // If not added (should be last), append it
            if (!added) {
                const option = document.createElement('option');
                option.value = newItem;
                option.textContent = newItem;
                itemDropdown.appendChild(option);
            }
        }

        // Update item filter in reports
        const itemFilter = document.getElementById('itemFilter');
        if (itemFilter) {
            // Remove empty option if it's the only one
            if (itemFilter.options.length === 1 && itemFilter.options[0].value === "") {
                itemFilter.innerHTML = '';

            // Add new item in alphabetical order

            }
        }
    }

        // Function to wrap a single table
        function wrapTable(table) {
            if (!table || table.classList.contains('header-frozen')) return;

            // Check if table has a header
            if (!table.querySelector('thead')) {
                console.warn('Table has no thead element');
                return;
            }

            // Create wrapper div
            const wrapper = document.createElement('div');
            wrapper.className = 'table-scroll-container';

            // Wrap the table
            const parent = table.parentNode;

            // Check if already wrapped or already inside a table-responsive container
            if (parent.classList.contains('table-scroll-container') || parent.classList.contains('table-responsive')) {
                table.classList.add('header-frozen');
                return;
            }

            parent.replaceChild(wrapper, table);
            wrapper.appendChild(table);

            // Mark as processed
            table.classList.add('header-frozen');

            // Adjust column widths to prevent header misalignment
            setTimeout(() => {
                const headerCells = table.querySelectorAll('thead th');
                const bodyCells = table.querySelectorAll('tbody tr:first-child td');

                if (headerCells.length === bodyCells.length) {
                    headerCells.forEach((headerCell, index) => {
                        if (bodyCells[index]) {
                            const cellWidth = Math.max(
                                headerCell.offsetWidth,
                                bodyCells[index].offsetWidth
                            );
                            headerCell.style.minWidth = cellWidth + 'px';
                            if (bodyCells[index]) {
                                bodyCells[index].style.minWidth = cellWidth + 'px';
                            }
                        }
                    });
                }

                // Ensure table takes full width
                table.style.width = '100%';
                table.style.tableLayout = 'auto';
            }, 100);
        }

        // Function to wrap all tables
        function wrapAllTables() {
            const tableContainers = document.querySelectorAll('.table-container, .table-responsive');

            tableContainers.forEach(container => {
                const table = container.querySelector('table');
                if (table && !table.classList.contains('header-frozen')) {
                    wrapTable(table);
                }
            });

            // Also check for tables directly in page content
            const pageContents = document.querySelectorAll('.page-content');
            pageContents.forEach(content => {
                const tables = content.querySelectorAll('table:not(.header-frozen)');
                tables.forEach(table => {
                    if (table.querySelector('thead')) {
                        // Create a container if needed
                        if (!table.parentNode.classList.contains('table-container') &&
                            !table.parentNode.classList.contains('table-responsive')) {
                            const container = document.createElement('div');
                            container.className = 'table-responsive';
                            table.parentNode.insertBefore(container, table);
                            container.appendChild(table);
                        }
                        wrapTable(table);
                    }
                });
            });
        }

        // Initialize
        setTimeout(wrapAllTables, 300);

        // Re-apply when content changes (for dynamic tables)
        const observer = new MutationObserver(() => {
            setTimeout(wrapAllTables, 100);
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        // Return function for manual triggering
        return wrapAllTables;
    }

    function loadDataSummary(isBackground = false) {
        const yearSelect = document.getElementById('summary-year');
        const year = yearSelect ? yearSelect.value : new Date().getFullYear().toString();
        const cacheKey = `summary_${year}`;

        // 1. Instant check from cache (0ms delay)
        const cachedSummary = window.expenseCache ? window.expenseCache.get(cacheKey) : null;
        if (cachedSummary) {
            handleSummaryData(cachedSummary);
            return;
        }

        // 2. Instant calculation from in-memory all_data (0ms delay)
        const allData = window.expenseCache ? window.expenseCache.get('all_data') : null;
        const expenses = (allData && allData.allExpenses) || (typeof allExpenseData !== 'undefined' ? allExpenseData : null);
        if (expenses && expenses.length > 0 && typeof calculateSummaryDataFromAllData === 'function') {
            const calculated = calculateSummaryDataFromAllData(expenses, year);
            if (calculated) {
                if (window.expenseCache) window.expenseCache.set(cacheKey, calculated);
                handleSummaryData(calculated);
                return;
            }
        }

        // Show loading indicator only when waiting on network
        const page = document.getElementById('data-page');
        if (page && !isBackground && !page.querySelector('.spinner-container')) {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'spinner-container';
            loadingDiv.innerHTML = '<div class="spinner"></div>';
            page.appendChild(loadingDiv);
        }

        // Try Google Apps Script with fallback to mock data
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((data) => {
                    if (window.expenseCache) window.expenseCache.set(cacheKey, data);
                    handleSummaryData(data);
                    const loadingDiv = page ? page.querySelector('.spinner-container') : null;
                    if (loadingDiv) loadingDiv.remove();
                })
                .withFailureHandler((error) => {
                    console.error("Error loading summary data:", error);
                    const loadingDiv = page ? page.querySelector('.spinner-container') : null;
                    if (loadingDiv) loadingDiv.remove();
                    const mockData = getEmptySummary();
                    handleSummaryData(mockData);
                })
                .getSummaryData(year);
        } else {
            console.log("Using local calculation or empty summary");
            const loadingDiv = page ? page.querySelector('.spinner-container') : null;
            if (loadingDiv) loadingDiv.remove();
            handleSummaryData(getEmptySummary());
        }
    }

        if (data.yearlyTotal !== undefined) {

        if (data.monthlyAverage !== undefined) {

        // Update category distribution
        if (data.categoryDistribution) {

        // Update user spending

    function handleCategoryExpensesData(response) {
        const loadingDiv = document.getElementById('categories-loading');
        if (loadingDiv) loadingDiv.remove();

        if (response.error) {
            showAlert("Error: " + response.error, "danger");
            return;
        }

        const data = response.allExpenses || [];
        const categorySums = {};
        let grandTotal = 0;

        const monthFilter = document.getElementById('cat-month-filter') ? document.getElementById('cat-month-filter').value : 'all';
        const yearFilter = document.getElementById('cat-year-filter') ? document.getElementById('cat-year-filter').value : 'all';

        data.forEach(row => {
            const month = String(row[1] || "").trim();
            const category = String(row[2] || "Uncategorized").trim();
            const amount = parseFloat(row[3]) || 0;
            const year = String(row[5] || "").trim();

            let includeRow = true;
            if (monthFilter !== 'all' && month !== monthFilter) includeRow = false;
            if (yearFilter !== 'all' && year !== yearFilter) includeRow = false;

            if (includeRow && category) {
                if (!categorySums[category]) categorySums[category] = 0;
                categorySums[category] += amount;
                grandTotal += amount;
            }
        });

        // Sort descending
        const sortedCategories = Object.keys(categorySums).sort((a, b) => categorySums[b] - categorySums[a]);

        // Populate KPI Cards
        const kpiTotal = document.getElementById('cat-kpi-total');
        const kpiHighest = document.getElementById('cat-kpi-highest');
        const kpiSpending = document.getElementById('cat-kpi-spending');
        const kpiAvg = document.getElementById('cat-kpi-avg');

        if (kpiTotal) kpiTotal.textContent = sortedCategories.length;
        if (kpiHighest && sortedCategories.length > 0) {
            const topCat = sortedCategories[0];
            kpiHighest.textContent = topCat;
            kpiHighest.title = `${topCat}: ${categorySums[topCat].toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 })}`;
        }
        if (kpiSpending) kpiSpending.textContent = grandTotal.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        if (kpiAvg && sortedCategories.length > 0) {
            const avgVal = grandTotal / sortedCategories.length;
            kpiAvg.textContent = avgVal.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        }

        // Render Category Chart
        try {
            if (window.categoryDistChartInstance) {
                window.categoryDistChartInstance.destroy();
            }

            const top5Cats = sortedCategories.slice(0, 5);
            const top5Sums = top5Cats.map(cat => categorySums[cat]);

            let otherSum = 0;
            sortedCategories.slice(5).forEach(cat => {
                otherSum += categorySums[cat];
            });

            const labels = [...top5Cats];
            const dataVals = [...top5Sums];
            if (otherSum > 0) {
                labels.push('Others');
                dataVals.push(otherSum);
            }

            const ctx = document.getElementById('categoryDistributionChart');
            if (ctx) {
                const ctx2d = ctx.getContext('2d');
                window.categoryDistChartInstance = new Chart(ctx2d, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: dataVals,
                            backgroundColor: [
                                '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#64748b'
                            ],
                            borderWidth: 1,
                            borderColor: 'rgba(255, 255, 255, 0.1)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    color: 'rgba(255, 255, 255, 0.7)',
                                    font: { size: 10 }
                                }
                            }
                        }
                    }
                });
            }
        } catch (e) {
            console.error("Failed to render category distribution chart:", e);
        }

        const tableBody = document.getElementById('category-ranking-body');
        if (!tableBody) return;

        let rowsHtml = '';
        sortedCategories.forEach((cat, index) => {
            const amt = categorySums[cat];
            const pct = grandTotal > 0 ? ((amt / grandTotal) * 100).toFixed(1) : 0;

            // Escaping quotes for cat name
            const escapedCatName = String(cat).replace(/'/g, "\\'");

            let rankStyle = 'color: #94a3b8;';
            let rankText = `${index + 1}`;
            if (index === 0) {
                rankStyle = 'color: #facc15; font-weight: 800;';
                rankText = `<i class="fas fa-crown me-1" style="color: #facc15;"></i> 1`;
            } else if (index === 1) {
                rankStyle = 'color: #cbd5e1; font-weight: 800;';
            } else if (index === 2) {
                rankStyle = 'color: #d97706; font-weight: 800;';
            }

            rowsHtml += `
                <tr onclick="viewCategoryDetails('${escapedCatName}')" style="cursor: pointer;" class="category-row">
                    <td style="font-size: 0.85rem; ${rankStyle}">${rankText}</td>
                    <td style="font-size: 0.85rem; font-weight: 600; color: #fff;">${cat}</td>
                    <td>
                        <div class="progress-premium">
                            <div class="progress-bar-premium" role="progressbar" style="width: ${pct}%;" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
                                ${pct}%
                            </div>
                        </div>
                    </td>
                    <td style="text-align: right; font-size: 0.85rem; font-weight: bold; color: var(--accent-color);">${amt.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 })}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = rowsHtml || '<tr><td colspan="4" class="text-center">No category data found</td></tr>';

        // Automatically click first category if present to show more records immediately
        if (sortedCategories.length > 0) {
            viewCategoryDetails(sortedCategories[0]);
        }
    }

    function handleYearlyChartData(response) {
        const loadingDiv = document.getElementById('yearly-chart-loading');
        if (loadingDiv) loadingDiv.remove();

        if (response.error) {
            showAlert("Error: " + response.error, "danger");
            return;
        }

        const data = response.allExpenses || [];

        // Group by year and month
        const yearSums = {};
        const yearMonthData = {};
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        data.forEach(row => {
            const month = String(row[1] || "");
            const year = String(row[5] || "");
            const amount = parseFloat(row[3]) || 0;

            if (year) {
                const y = parseInt(year);
                if (isNaN(y) || y < 2021) return; // Skip years older than 2021 (like 2001)

                if (!yearSums[year]) yearSums[year] = 0;
                yearSums[year] += amount;

                if (months.includes(month)) {
                    if (!yearMonthData[year]) {
                        yearMonthData[year] = { 'Jan': 0, 'Feb': 0, 'Mar': 0, 'Apr': 0, 'May': 0, 'Jun': 0, 'Jul': 0, 'Aug': 0, 'Sep': 0, 'Oct': 0, 'Nov': 0, 'Dec': 0 };
                    }
                    yearMonthData[year][month] += amount;
                }
            }
        });

        // Sort years ascending
        const sortedYears = Object.keys(yearSums).sort((a, b) => parseInt(a) - parseInt(b));
        const chartData = sortedYears.map(year => yearSums[year]);

        renderYearlyColChart(sortedYears, chartData);
        renderYearlyMonthChart(sortedYears, yearMonthData, months);

        // Render Ranking list
        const rankedYears = Object.keys(yearSums).map(y => ({ year: y, total: yearSums[y] }));
        rankedYears.sort((a, b) => b.total - a.total);

        const rankBody = document.getElementById('yearly-ranking-body');
        if (rankBody) {
            let rankHtml = '';
            let grandTotal = 0;

            rankedYears.forEach((item, index) => {
                grandTotal += item.total;

                let rankBadge = '';
                if (index === 0) rankBadge = '<span class="badge bg-warning text-dark" style="font-size:0.75rem;"><i class="fas fa-medal"></i> 1st</span>';
                else if (index === 1) rankBadge = '<span class="badge bg-secondary" style="font-size:0.75rem;"><i class="fas fa-medal"></i> 2nd</span>';
                else if (index === 2) rankBadge = '<span class="badge text-white" style="background-color: #cd7f32; font-size:0.75rem;"><i class="fas fa-medal"></i> 3rd</span>';
                else rankBadge = `<span style="font-size:0.8rem; padding-left:5px; font-weight:bold; color:#888;">${index + 1}th</span>`;

                rankHtml += `
                <tr style="height: 40px;">
                  <td style="vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05);">${rankBadge}</td>
                  <td style="font-weight: bold; font-size:0.85rem; vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05);">${item.year}</td>
                  <td style="text-align: right; color: #4CAF50; font-weight: bold; font-size:0.85rem; vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05);">₹${item.total.toLocaleString('en-IN', { maximumFractionDigits: 0 })}</td>
                </tr>`;
            });

    function loadGraphs(isBackground = false) {
        const typeEl = document.getElementById('graph-type');
        const yearEl = document.getElementById('graph-year');
        const userEl = document.getElementById('graph-user');

        const type = typeEl ? typeEl.value : 'line';
        const year = yearEl ? yearEl.value : new Date().getFullYear().toString();
        const user = userEl ? userEl.value : 'all';
        const cacheKey = `graphs_${type}_${year}_${user}`;

        // Update chart title immediately
        const titleEl = document.getElementById('main-chart-title');
        if (titleEl) titleEl.textContent = getChartTitle(type);

        // 1. Instant check from cache (0ms delay)
        const cachedGraphs = window.expenseCache ? window.expenseCache.get(cacheKey) : null;
        if (cachedGraphs) {
            handleGraphsData(cachedGraphs, type, year, user);
            return;
        }

        // 2. Instant calculation from in-memory all_data (0ms delay)
        const allData = window.expenseCache ? window.expenseCache.get('all_data') : null;
        const expenses = (allData && allData.allExpenses) || (typeof allExpenseData !== 'undefined' ? allExpenseData : null);
        if (expenses && expenses.length > 0 && typeof calculateGraphsDataFromAllData === 'function') {
            const calculated = calculateGraphsDataFromAllData(expenses, type, year, user);
            if (calculated) {
                if (window.expenseCache) window.expenseCache.set(cacheKey, calculated);
                handleGraphsData(calculated, type, year, user);
                return;
            }
        }

        // Show loading indicator only when waiting on network
        const page = document.getElementById('graphs-page');
        if (page && !isBackground && !document.getElementById('graphs-loading')) {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'spinner-container';
            loadingDiv.innerHTML = '<div class="spinner"></div>';
            loadingDiv.id = 'graphs-loading';
            page.appendChild(loadingDiv);
        }

        // Try to get data from backend
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((data) => {
                    if (window.expenseCache) window.expenseCache.set(cacheKey, data);
                    handleGraphsData(data, type, year, user);
                })
                .withFailureHandler((error) => {
                    console.warn("Backend error, using fallback data:", error);
                    const fallbackData = generateFallbackGraphData(type, year, user);
                    handleGraphsData(fallbackData, type, year, user);
                })
                .getGraphsData(type, year, user);
        } else {
            const fallbackData = generateFallbackGraphData(type, year, user);
            handleGraphsData(fallbackData, type, year, user);
        }
    }

    function handleGraphsData(data, type, year, user) {
        console.log('Graphs Data Received:', { type, year, user, data });

        // Remove loading indicator
        const loadingDiv = document.getElementById('graphs-loading');
        if (loadingDiv) loadingDiv.remove();

        // Update main chart
        if (data && data.mainChart) {
            renderMainChart(data.mainChart, type);
        } else {
            console.warn('No mainChart data, generating fallback');
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderMainChart(fallbackData.mainChart, type);
        }

        // Update pie chart
        if (data && data.pieChart) {
            renderPieChart(data.pieChart);
        } else {
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderPieChart(fallbackData.pieChart);
        }

        // Update bar chart
        if (data && data.barChart) {
            renderBarChart(data.barChart);
        } else {
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderBarChart(fallbackData.barChart);
        }

        // Update detailed chart
        if (data && data.detailedChart) {
            renderDetailedChart(data.detailedChart);
        } else {
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderDetailedChart(fallbackData.detailedChart);
        }

        showAlert("Graphs Updated Successfully!", "success");
    }

    function generateRandomData(count, min, max) {
        return Array.from({ length: count }, () =>
            Math.floor(Math.random() * (max - min + 1)) + min

    }

    function generateFallbackYearlyData() {
        console.log("Generating fallback yearly data");

        const currentYear = new Date().getFullYear();
        const years = [currentYear - 2, currentYear - 1, currentYear];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // Generate mock expense data
        const allExpenses = [];
        let id = 1;

        years.forEach(year => {
            months.forEach(month => {
                // Generate 2-5 expenses per month
                const numExpenses = Math.floor(Math.random() * 4) + 2;
                for (let i = 0; i < numExpenses; i++) {
                    const amount = Math.floor(Math.random() * 5000) + 100;
                    const categories = ['Groceries', 'Transport', 'Food', 'Utilities', 'Entertainment', 'Shopping', 'Health'];
                    const category = categories[Math.floor(Math.random() * categories.length)];

                    allExpenses.push([
                        id++,                    // ID
                        month,                   // Month
                        category,                // Category
                        amount,                  // Amount
                        `Expense ${id}`,         // Description
                        year.toString(),         // Year
                        'User' + (Math.floor(Math.random() * 3) + 1) // User
                    ]);
                }
            });
        });

        return {
            allExpenses: allExpenses,
            error: null
        };
    }

    // SaaS: Top Progress Bar Logic
    const Progress = {
        start: function () {
            const bar = document.getElementById('nprogress');
            if (bar) {
                bar.classList.remove('d-none');
                bar.querySelector('.bar').style.width = '0%';
                setTimeout(() => bar.querySelector('.bar').style.width = '30%', 10);
            }
        },
        done: function () {
            const bar = document.getElementById('nprogress');
            if (bar) {
                bar.querySelector('.bar').style.width = '100%';
                setTimeout(() => {
                    bar.classList.add('d-none');

    // SaaS: Command Palette & Keyboard Shortcuts
    const COMMANDS = [

        { id: 'goto-reports', title: 'View Reports', icon: 'fa-chart-bar', action: () => showPage('reports'), shortcut: 'R' },
        { id: 'toggle-theme', title: 'Toggle Theme', icon: 'fa-moon', action: toggleTheme, shortcut: 'T' },

    function openCommandPalette() {

    function filterCommands() {
        const query = document.getElementById('command-input').value.toLowerCase();
        const results = COMMANDS.filter(cmd => cmd.title.toLowerCase().includes(query));
        renderCommandResults(results);
    }

    function renderCommandResults(results) {
        const container = document.getElementById('command-results');
        container.innerHTML = results.map((cmd, index) => `
            <div class="command-item ${index === selectedCommandIndex ? 'active' : ''}" onclick="executeCommand('${cmd.id}')">
                <i class="fas ${cmd.icon}"></i>
                <span>${cmd.title}</span>
                <span class="command-shortcut">${cmd.shortcut}</span>
            </div>
        `).join('');
    }

    function executeCommand(id) {
        const cmd = COMMANDS.find(c => c.id === id);
        if (cmd) {
            cmd.action();
            closeCommandPalette();
        }
    }

    // Global Keyboard Listeners
    window.addEventListener('keydown', (e) => {
        // Cmd+K or Ctrl+K for Palette
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            openCommandPalette();
        }

        // Close Palette on ESC
        if (e.key === 'Escape') closeCommandPalette();

        // Shortcuts (only if not typing in an input)
        if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            const key = e.key.toUpperCase();
            const cmd = COMMANDS.find(c => c.shortcut === key);
            if (cmd) {
                e.preventDefault();
                cmd.action();
            }
        }
    });

    // SaaS: Automatic Progress Bar for Google Script Calls
    (function wrapGSR() {
        const originalRun = google.script.run;
        const proxy = new Proxy(originalRun, {
            get(target, prop) {
                if (typeof target[prop] === 'function') {
                    return function (...args) {
                        Progress.start();
                        const result = target[prop](...args);
                        // We wrap the returned object to catch success/failure
                        return {
                            withSuccessHandler: function (sh) {
                                return result.withSuccessHandler((...shArgs) => {
                                    Progress.done();
                                    sh(...shArgs);
                                });
                            },
                            withFailureHandler: function (fh) {
                                return result.withFailureHandler((...fhArgs) => {
                                    Progress.done();
                                    fh(...fhArgs);
                                });
                            }
                        };
                    };
                }
                return target[prop];
            }
        });
        // Note: Replacing the global proxy might be complex due to how GSR works, 
        // so we'll manually add Progress.start/done to key functions instead for stability.
    })();

    // Manually add to key functions for maximum stability
    const originalLoadMonth = loadMonth;
    loadMonth = function (...args) {
        Progress.start();
        return originalLoadMonth.apply(this, args);
    };

    const originalHandleMonthData = handleMonthData;
    handleMonthData = function (...args) {
        Progress.done();
        return originalHandleMonthData.apply(this, args);
    };

        // Show a loading indicator since this operation might take 1-2 seconds
        showAlert("Applying Formula 2 " + targetMonth + " sheet. ", "info");

        google.script.run
            .withSuccessHandler(function (result) {
                if (result.success) {
                    showAlert("Successfully Applied Formulas 2 " + targetMonth, "success");
                    // Refresh current month view to see any ID or sequence number updates
                    if (typeof loadMonth === 'function') {
                        loadMonth(targetMonth);
                    }
                } else {
                    showAlert("Error applying formulas: " + (result.error || "Unknown error"), "danger");
                }
            })
            .withFailureHandler(function (error) {
                showAlert("Failed to contact backend: " + error, "danger");
                console.error("Formula Application Error:", error);
            })
            .runCompleteProcess(targetMonth);
    }
